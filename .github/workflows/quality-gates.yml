name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hub-studio:
    name: Hub Studio templates and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:hub
      - run: npm run build:hub

  sang-math:
    name: sang-math / Typst ${{ matrix.typst-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typst-version: ["0.14.0", "latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst-version }}
      - name: Compile every package test
        run: |
          for file in typst-pkg-sang-math/tests/*.typ; do
            typst compile --root . "$file" "/tmp/$(basename "$file" .typ).pdf"
          done
      - name: Compile package examples
        run: |
          typst compile --root . typst-pkg-sang-math/examples/exam-template-demo.typ /tmp/exam-template-demo.pdf
          typst compile --root . typst-pkg-sang-math/examples/book-template-demo.typ /tmp/book-template-demo.pdf
      - name: Compile full HDSD
        if: matrix.typst-version == 'latest'
        run: typst compile --root . typst/hdsd-exam.typ /tmp/hdsd-exam.pdf

  platform-functions:
    name: Platform access and retention policies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conictypst-platform/functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conictypst-platform/functions/package-lock.json
      - run: npm ci
      - run: npm test

  system-contracts:
    name: Cross-app contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test tests/exam-passport.test.mjs
