name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hub-studio:
    name: Hub Studio templates and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:hub
      - run: npm run test:sang-math-guide
      - run: npm run build:hub

  sang-math:
    name: sang-math / Typst ${{ matrix.typst-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typst-version: ["0.15.0", "0.15.1"]
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst-version }}
      - name: Compile every package test
        run: |
          for file in typst-pkg-sang-math/tests/*.typ; do
            typst compile --root . "$file" "/tmp/$(basename "$file" .typ).pdf"
          done
          for file in typst-pkg-sang-math/tests/legacy/*.typ; do
            typst compile --root . "$file" "/tmp/$(basename "$file" .typ).pdf"
          done
      - name: Compile package examples
        run: |
          typst compile --root . typst-pkg-sang-math/examples/exam-template-demo.typ /tmp/exam-template-demo.pdf
          typst compile --root . typst-pkg-sang-math/examples/book-template-demo.typ /tmp/book-template-demo.pdf
          typst compile --root . typst-pkg-sang-math/examples/qr-12-4-6.typ /tmp/qr-12-4-6.pdf
          for file in typst-pkg-sang-math/examples/copy-ready/*.typ; do
            name="$(basename "$file" .typ)"
            typst compile --root . "$file" "/tmp/${name}.pdf"
            typst compile --root . --input profile=loigiai "$file" "/tmp/${name}-loigiai.pdf"
          done
          typst compile --root . typst-pkg-sang-math/docs/manual.typ /tmp/sang-math-manual.pdf
      - name: Compile OMR presets and state include
        run: |
          for name in 12-4-6ngang ds-12 hybrid-28tn-12ds thptqg-toan-2025 tln-10 tn-40 tn-50 tn-60 state-example; do
            typst compile --root . "sang-math-omr/templates/$name.typ" "/tmp/omr-$name.pdf"
          done
      - name: Compile full HDSD
        if: matrix.typst-version == '0.15.1'
        run: typst compile --root . typst/hdsd-exam.typ /tmp/hdsd-exam.pdf
      - name: Compile every copy-ready HDSD example
        if: matrix.typst-version == '0.15.1'
        run: |
          mkdir -p /tmp/sang-math-guide-packages/local/sang-math
          ln -s "$PWD/typst-pkg-sang-math" /tmp/sang-math-guide-packages/local/sang-math/1.1.0
          for file in public/hdsd/examples/sang-math-1-1/[0-9][0-9]-*.typ; do
            typst compile --root . --package-path /tmp/sang-math-guide-packages "$file" "/tmp/guide-$(basename "$file" .typ).pdf"
          done

  platform-functions:
    name: Platform access and retention policies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conictypst-platform/functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conictypst-platform/functions/package-lock.json
      - run: npm ci
      - run: npm test

  system-contracts:
    name: Cross-app contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test tests/exam-passport.test.mjs
      - run: npm run test:hdsd:ai-contract
