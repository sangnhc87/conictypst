[package]
name = "casio-fx580"
version = "1.0.0"
description = "Casio fx-580VN X Scientific Calculator Simulator"
authors = ["Nguyen Sang <sangbeau@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
