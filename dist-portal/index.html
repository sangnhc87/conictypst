<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 Kho Bài Giảng Toán THPT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#f1f5fb;--surf:#fff;--border:#e4e9f0;
  --text:#1a2332;--muted:#64748b;
  --primary:#4361ee;--primary-dim:#eef0fd;
  --sb:#17203a;--sb-text:#a8b5cc;
  --sh-sm:0 1px 4px rgba(0,0,0,.06);
  --sh-lg:0 16px 40px rgba(0,0,0,.13);
  --r:14px;--tr:.22s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0d1321;--surf:#15202b;--border:#253044;
  --text:#e2eaf5;--muted:#7a90a8;--primary-dim:#1c234a;
  --sb:#0d1321;--sh-lg:0 16px 40px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;transition:background var(--tr),color var(--tr)}
a{text-decoration:none;color:inherit}

/* ── SIDEBAR ────────────────────────────────────── */
.sb{width:256px;min-height:100vh;background:var(--sb);display:flex;
  flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid rgba(255,255,255,.04)}
.sb-logo{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;gap:12px}
.sb-logo .ico{width:38px;height:38px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#4361ee,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(67,97,238,.4)}
.sb-logo .ico i{font-size:17px;color:#fff}
.sb-logo strong{display:block;font-size:13.5px;font-weight:700;color:#fff}
.sb-logo span{font-size:11px;color:var(--sb-text);opacity:.65}

.sb-sec{padding:16px 16px 5px;font-size:10px;font-weight:700;
  letter-spacing:.12em;color:rgba(255,255,255,.22);text-transform:uppercase}

.nav{display:flex;align-items:center;gap:9px;padding:8px 11px;
  margin:2px 7px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--sb-text);cursor:pointer;user-select:none;
  transition:background var(--tr),color var(--tr)}
.nav i{width:18px;text-align:center;font-size:14px;opacity:.75}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav:hover i{opacity:1}
.nav.on{background:#4361ee;color:#fff}
.nav.on i{opacity:1}
.nb{margin-left:auto;font-size:10px;font-weight:700;
  background:rgba(255,255,255,.13);color:#fff;
  padding:2px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav.on .nb{background:rgba(255,255,255,.25)}

/* Chapter sub-nav */
.ch-nav{overflow:hidden;max-height:0;transition:max-height .3s ease}
.ch-nav.open{max-height:600px}
.ch-nav-item{display:flex;align-items:center;gap:8px;padding:7px 11px 7px 32px;
  margin:1px 7px;border-radius:7px;font-size:12.5px;font-weight:500;
  color:rgba(168,181,204,.7);cursor:pointer;user-select:none;
  transition:background var(--tr),color var(--tr)}
.ch-nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9)}
.ch-nav-item.on{color:#93c5fd;background:rgba(67,97,238,.18)}

.sb-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.05)}
.theme-btn{width:100%;padding:9px 12px;display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.05);border:none;border-radius:8px;
  color:var(--sb-text);font-size:13px;font-weight:500;cursor:pointer;
  font-family:inherit;transition:background var(--tr)}
.theme-btn:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── MAIN ───────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar{height:62px;background:var(--surf);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 24px;
  position:sticky;top:0;z-index:20;
  transition:background var(--tr),border-color var(--tr)}
.quicklinks{display:flex;align-items:center;gap:8px;margin-left:auto}
.qbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;
  border-radius:8px;font-size:12.5px;font-weight:600;
  text-decoration:none;transition:opacity var(--tr),transform var(--tr);white-space:nowrap}
.qbtn:hover{opacity:.82;transform:translateY(-1px)}
.qbtn-beamer{background:#1e263a;color:#93c5fd;border:1px solid #2e3f5e}
.qbtn-beamer:hover{background:#253045}
.qbtn-hdsd{background:#064e3b;color:#6ee7b7;border:1px solid #065f46}
.qbtn-hdsd:hover{background:#065f46}
.sw{position:relative;flex:1;max-width:400px}
.sw i{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;font-size:13px}
#si{width:100%;padding:9px 14px 9px 38px;background:var(--bg);
  border:1.5px solid var(--border);border-radius:24px;font-size:14px;
  font-family:inherit;color:var(--text);outline:none;
  transition:border-color var(--tr),box-shadow var(--tr)}
#si:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,97,238,.12)}
#si::placeholder{color:var(--muted)}

.cnt{padding:28px 30px 40px;overflow-y:auto;flex:1}

/* Stats */
.srow{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.sc{background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;display:flex;align-items:center;gap:12px;flex:1;min-width:100px;
  box-shadow:var(--sh-sm)}
.sico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0}
.snum{font-size:24px;font-weight:800;line-height:1}
.slbl{font-size:11px;color:var(--muted);margin-top:2px}

/* Chapter sections */
.ch-section{margin-bottom:32px}
.ch-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;
  padding-bottom:10px;border-bottom:2px solid var(--border)}
.ch-header-icon{width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0}
.ch-header h3{font-size:16px;font-weight:700}
.ch-header .ch-count{margin-left:auto;font-size:12px;font-weight:600;
  color:var(--muted);background:var(--bg);border:1px solid var(--border);
  padding:3px 10px;border-radius:20px}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

/* Card */
.card{background:var(--surf);border:1px solid var(--border);border-radius:15px;
  overflow:hidden;box-shadow:var(--sh-sm);display:flex;flex-direction:column;
  transition:transform var(--tr),box-shadow var(--tr)}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg)}

.thumb{height:136px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
/* gradients */
.th-indigo{background:linear-gradient(135deg,#4338ca,#6366f1)}
.th-orange {background:linear-gradient(135deg,#c2410c,#f97316)}
.th-teal   {background:linear-gradient(135deg,#0f766e,#14b8a6)}
.th-blue   {background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.th-violet {background:linear-gradient(135deg,#6d28d9,#a78bfa)}
.th-pink   {background:linear-gradient(135deg,#be185d,#f472b6)}
.th-green  {background:linear-gradient(135deg,#15803d,#4ade80)}
.th-amber  {background:linear-gradient(135deg,#b45309,#fbbf24)}
.th-red    {background:linear-gradient(135deg,#b91c1c,#f87171)}
.th-cyan   {background:linear-gradient(135deg,#0369a1,#38bdf8)}
.th-seq    {background:linear-gradient(135deg,#1e3a8a,#60a5fa)}
.th-exp    {background:linear-gradient(135deg,#831843,#fb7185)}

.thumb-icon{font-size:54px;color:rgba(255,255,255,.92);
  text-shadow:0 6px 24px rgba(0,0,0,.25);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:2}
.card:hover .thumb-icon{transform:scale(1.18) rotate(-6deg)}
.thumb::before,.thumb::after{content:'';position:absolute;border-radius:50%;
  background:rgba(255,255,255,.08);pointer-events:none}
.thumb::before{width:110px;height:110px;top:-25px;right:-25px}
.thumb::after{width:70px;height:70px;bottom:-18px;left:-18px}

.grade-pill{position:absolute;top:10px;right:10px;z-index:3;
  background:rgba(255,255,255,.18);backdrop-filter:blur(10px);
  color:#fff;font-size:10px;font-weight:700;border-radius:20px;
  padding:3px 9px;border:1px solid rgba(255,255,255,.28)}

.cbody{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.ctitle{font-size:14px;font-weight:600;line-height:1.45;flex:1;margin-bottom:14px}

.launch{display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--primary);color:#fff;padding:8px 0;border-radius:8px;
  font-size:12.5px;font-weight:600;transition:background var(--tr),transform var(--tr)}
.launch:hover{background:#3451d1;transform:scale(1.02)}
.launch i{font-size:11px}

.empty{text-align:center;padding:60px 0;color:var(--muted)}
.empty i{font-size:48px;display:block;margin-bottom:12px;opacity:.3}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sb">
  <div class="sb-logo">
    <div class="ico"><i class="fa-solid fa-graduation-cap"></i></div>
    <div><strong>Toán THPT</strong><span>GV Nguyễn Văn Sang</span></div>
  </div>

  <div class="sb-sec">Khối lớp</div>
  <div class="nav on" data-f="all" id="nav-all">
    <i class="fa-solid fa-layer-group"></i> Tất cả
    <span class="nb" id="b-all">0</span>
  </div>

  <!-- Khối 10 -->
  <div class="nav" data-f="Khối 10" id="nav-10">
    <i class="fa-solid fa-seedling" style="color:#4ade80"></i> Toán 10
    <span class="nb" id="b-10">0</span>
  </div>
  <div class="ch-nav" id="chn-10"></div>

  <!-- Khối 11 -->
  <div class="nav" data-f="Khối 11" id="nav-11">
    <i class="fa-solid fa-fire" style="color:#fb923c"></i> Toán 11
    <span class="nb" id="b-11">0</span>
  </div>
  <div class="ch-nav" id="chn-11"></div>

  <!-- Khối 12 -->
  <div class="nav" data-f="Khối 12" id="nav-12">
    <i class="fa-solid fa-star" style="color:#818cf8"></i> Toán 12
    <span class="nb" id="b-12">0</span>
  </div>
  <div class="ch-nav" id="chn-12"></div>

  <div class="sb-foot">
    <button class="theme-btn" id="tbtn">
      <i class="fa-solid fa-circle-half-stroke"></i> Dark / Light Mode
    </button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <header class="topbar">
    <div class="sw">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="si" type="text" placeholder="Tìm bài giảng…">
    </div>
    <div class="quicklinks">
      <a class="qbtn qbtn-beamer" href="https://beamer-sangnhc.pages.dev" target="_blank" rel="noopener">
        <i class="fa-solid fa-film"></i> Thư viện Beamer
      </a>
      <a class="qbtn qbtn-hdsd" href="https://hdsd-conictypst.pages.dev" target="_blank" rel="noopener">
        <i class="fa-solid fa-book"></i> HDSD & Trộn đề
      </a>
    </div>
  </header>

  <div class="cnt">
    <!-- Stats -->
    <div class="srow">
      <div class="sc">
        <div class="sico" style="background:#eef2ff"><i class="fa-solid fa-book-open" style="color:#4361ee"></i></div>
        <div><div class="snum" id="s-all">0</div><div class="slbl">Tổng bài giảng</div></div>
      </div>
      <div class="sc">
        <div class="sico" style="background:#dcfce7"><i class="fa-solid fa-seedling" style="color:#16a34a"></i></div>
        <div><div class="snum" id="s-10">0</div><div class="slbl">Toán 10</div></div>
      </div>
      <div class="sc">
        <div class="sico" style="background:#ffedd5"><i class="fa-solid fa-fire" style="color:#ea580c"></i></div>
        <div><div class="snum" id="s-11">0</div><div class="slbl">Toán 11</div></div>
      </div>
      <div class="sc">
        <div class="sico" style="background:#ede9fe"><i class="fa-solid fa-star" style="color:#7c3aed"></i></div>
        <div><div class="snum" id="s-12">0</div><div class="slbl">Toán 12</div></div>
      </div>
    </div>

    <div id="content-area"></div>
  </div>
</div>

<script>
let ALL=[], gradeFilter='all', chapterFilter=null, q='';

// Chapter section colours
const CH_STYLE = {
  'Mệnh đề & Tập hợp':     {bg:'#eef2ff',ic:'#4338ca',icon:'fa-brain'},
  'Bất phương trình':       {bg:'#fff7ed',ic:'#c2410c',icon:'fa-scale-balanced'},
  'Hệ thức lượng':          {bg:'#f0fdfa',ic:'#0f766e',icon:'fa-wave-square'},
  'Vectơ':                  {bg:'#eff6ff',ic:'#1d4ed8',icon:'fa-compass'},
  'Thống kê':               {bg:'#f5f3ff',ic:'#6d28d9',icon:'fa-chart-column'},
  'Hàm số & Đồ thị':       {bg:'#fdf2f8',ic:'#be185d',icon:'fa-chart-line'},
  'Hàm số':                 {bg:'#fdf2f8',ic:'#be185d',icon:'fa-chart-line'},
  'Phương pháp toạ độ':     {bg:'#f0fdf4',ic:'#15803d',icon:'fa-crosshairs'},
  'Đại số tổ hợp':          {bg:'#fffbeb',ic:'#b45309',icon:'fa-table-cells'},
  'Xác suất':               {bg:'#fef2f2',ic:'#b91c1c',icon:'fa-dice'},
  'Vectơ không gian':       {bg:'#ecfeff',ic:'#0369a1',icon:'fa-cube'},
  'Chương I':               {bg:'#eef2ff',ic:'#4338ca',icon:'fa-list-check'},
  'Dãy số, Cấp số cộng, Cấp số nhân': {bg:'#eff6ff',ic:'#1e3a8a',icon:'fa-arrow-trend-up'},
  'Hàm số mũ và Hàm số logarit':      {bg:'#fff1f2',ic:'#e11d48',icon:'fa-superscript'},
  'Hàm số & PT Lượng giác':           {bg:'#f0fdfa',ic:'#0f766e',icon:'fa-wave-square'},
};
function chStyle(chapter){
  return CH_STYLE[chapter]||{bg:'#f8fafc',ic:'#4361ee',icon:'fa-book'};
}

function groupByChapter(courses){
  const map=new Map();
  courses.forEach(c=>{
    if(!map.has(c.chapter)) map.set(c.chapter,[]);
    map.get(c.chapter).push(c);
  });
  return map;
}

function cardHTML(c){
  return `<article class="card">
    <div class="thumb ${c.theme||'th-indigo'}">
      <i class="${c.icon} thumb-icon"></i>
      <span class="grade-pill">${c.grade}</span>
    </div>
    <div class="cbody">
      <h3 class="ctitle">${c.title}</h3>
      <a href="${c.url}" target="_blank" rel="noopener" class="launch">
        <i class="fa-solid fa-play"></i> Trình chiếu
      </a>
    </div>
  </article>`;
}

function sectionHTML(chapter, courses){
  const st=chStyle(chapter);
  return `<div class="ch-section" data-chapter="${chapter}">
    <div class="ch-header">
      <div class="ch-header-icon" style="background:${st.bg}">
        <i class="fa-solid ${st.icon}" style="color:${st.ic}"></i>
      </div>
      <h3>${chapter}</h3>
      <span class="ch-count">${courses.length} bài</span>
    </div>
    <div class="grid">${courses.map(cardHTML).join('')}</div>
  </div>`;
}

function renderMain(){
  const area=document.getElementById('content-area');
  let src=ALL.filter(c=>{
    if(gradeFilter!=='all'&&c.grade!==gradeFilter) return false;
    if(chapterFilter&&c.chapter!==chapterFilter) return false;
    if(q&&![c.title,c.chapter,c.grade].some(s=>s.toLowerCase().includes(q))) return false;
    return true;
  });

  if(!src.length){
    area.innerHTML='<div class="empty"><i class="fa-solid fa-magnifying-glass"></i><p>Không tìm thấy bài giảng nào.</p></div>';
    return;
  }

  const grouped=groupByChapter(src);
  area.innerHTML=[...grouped.entries()].map(([ch,cs])=>sectionHTML(ch,cs)).join('');
}

function buildChapterNav(grade, containerId){
  const el=document.getElementById(containerId);
  const chapters=[...new Set(ALL.filter(c=>c.grade===grade).map(c=>c.chapter))];
  el.innerHTML=chapters.map(ch=>{
    const st=chStyle(ch);
    const n=ALL.filter(c=>c.grade===grade&&c.chapter===ch).length;
    return `<div class="ch-nav-item" data-grade="${grade}" data-ch="${ch}">
      <i class="fa-solid ${st.icon}" style="color:${st.ic};font-size:12px"></i>
      <span style="flex:1">${ch}</span>
      <span style="font-size:10px;opacity:.6">${n}</span>
    </div>`;
  }).join('');

  el.querySelectorAll('.ch-nav-item').forEach(item=>{
    item.addEventListener('click',()=>{
      document.querySelectorAll('.ch-nav-item').forEach(x=>x.classList.remove('on'));
      document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));
      const g=item.dataset.grade;
      document.getElementById('nav-'+g.replace('Khối ','')).classList.add('on');
      item.classList.add('on');
      gradeFilter=g;
      chapterFilter=item.dataset.ch;
      renderMain();
    });
  });
}

fetch('data.json')
  .then(r=>r.json())
  .then(data=>{
    ALL=data;
    const n10=data.filter(c=>c.grade==='Khối 10').length;
    const n11=data.filter(c=>c.grade==='Khối 11').length;
    const n12=data.filter(c=>c.grade==='Khối 12').length;
    document.getElementById('s-all').textContent=data.length;
    document.getElementById('s-10').textContent=n10;
    document.getElementById('s-11').textContent=n11;
    document.getElementById('s-12').textContent=n12;
    document.getElementById('b-all').textContent=data.length;
    document.getElementById('b-10').textContent=n10;
    document.getElementById('b-11').textContent=n11;
    document.getElementById('b-12').textContent=n12;
    buildChapterNav('Khối 10','chn-10');
    buildChapterNav('Khối 11','chn-11');
    buildChapterNav('Khối 12','chn-12');
    renderMain();
  })
  .catch(()=>{
    document.getElementById('content-area').innerHTML=
      '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Truy cập: <b>http://localhost:3000/portal/</b></p></div>';
  });

// Grade nav clicks
document.querySelectorAll('.nav[data-f]').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.nav').forEach(n=>n.classList.remove('on'));
    document.querySelectorAll('.ch-nav-item').forEach(n=>n.classList.remove('on'));
    el.classList.add('on');
    gradeFilter=el.dataset.f;
    chapterFilter=null;
    // Toggle chapter sub-nav
    ['10','11','12'].forEach(k=>{
      const chn=document.getElementById('chn-'+k);
      const shouldOpen=(gradeFilter==='Khối '+k||gradeFilter==='all');
      chn.classList.toggle('open', gradeFilter==='Khối '+k);
    });
    renderMain();
  });
});

// Search
document.getElementById('si').addEventListener('input',e=>{
  q=e.target.value.toLowerCase().trim();
  chapterFilter=null;
  document.querySelectorAll('.ch-nav-item').forEach(n=>n.classList.remove('on'));
  renderMain();
});

// Theme
document.getElementById('tbtn').addEventListener('click',()=>{
  const h=document.documentElement;
  h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');
});
</script>
</body>
</html>
