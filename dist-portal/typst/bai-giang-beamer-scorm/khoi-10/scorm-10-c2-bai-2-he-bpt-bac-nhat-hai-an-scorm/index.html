<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ BPT Bậc Nhất Hai Ẩn</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  onload="renderMathInElement(document.body,{delimiters:[
    {left:'$$',right:'$$',display:true},
    {left:'$',right:'$',display:false}
  ]})"></script>
<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
  --blue: #3b82f6; --blue-dim: #eff6ff;
  --green: #16a34a; --green-dim: #f0fdf4;
  --red: #dc2626; --red-dim: #fef2f2;
  --yellow: #eab308; --yellow-dim: #fefce8;
  --text: #0f172a; --muted: #475569;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
}
.header {
  background: linear-gradient(135deg,#003087 0%,#0047b3 100%);
  padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5); flex-shrink: 0;
}
.header-info .school { font-size:10px; color:#90caf9; }
.header-info .title  { font-size:15px; font-weight:700; color:#fff; margin:2px 0; }
.header-info .sub    { font-size:11px; color:#bbdefb; }
.progress-wrap {
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.progress-ring {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: conic-gradient(var(--blue) 0%, #1e2030 0%);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.4s;
}
.progress-ring-inner {
  width: 36px; height: 36px; background: #003087;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.score-badge {
  background: rgba(0,0,0,0.1);
  border: 1px solid rgba(0,0,0,0.2);
  padding: 4px 12px; border-radius: 20px;
  font-size: 12px; color: #fff; font-weight: 600;
  min-width: 70px; text-align: center;
}
.main { flex: 1; padding: 16px 20px; max-width: 860px; margin: 0 auto; width: 100%; }
.section-header {
  font-size: 11px; font-weight: 700; color: var(--blue);
  letter-spacing: 1px; text-transform: uppercase;
  margin: 20px 0 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  transition: border-color 0.2s;
}
.card.answered { border-color: var(--blue-dim); }
.card.correct  { border-color: var(--green); background: var(--green-dim); }
.card.wrong    { border-color: var(--red);   background: var(--red-dim); }
.q-header {
  display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px;
}
.q-num {
  background: var(--blue); color: #fff;
  border-radius: 6px; padding: 2px 8px;
  font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
}
.q-num.ds-type { background: #7c3aed; }
.q-num.tln-type { background: #0891b2; }
.q-stem { font-size: 14px; line-height: 1.6; white-space: pre-line; }
.options { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
.opt {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px; border-radius: 8px;
  border: 1px solid var(--border); cursor: pointer;
  transition: all 0.15s; font-size: 13.5px; line-height: 1.5;
  background: rgba(0,0,0,0.02);
}
.opt:hover:not(.disabled) { border-color: var(--blue); background: rgba(76,142,247,0.08); }
.opt .label {
  min-width: 24px; height: 24px;
  border: 2px solid var(--muted); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
  transition: all 0.15s;
}
.opt.selected .label { border-color: var(--blue); background: var(--blue); color: #fff; }
.opt.show-correct  { border-color: var(--green); background: rgba(34,197,94,0.1); }
.opt.show-correct .label { border-color: var(--green); background: var(--green); color: #fff; }
.opt.show-wrong    { border-color: var(--red); background: rgba(239,68,68,0.1); }
.opt.show-wrong .label { border-color: var(--red); background: var(--red); color: #fff; }
.opt.disabled { cursor: default; }

/* DS checkboxes */
.ds-opt { cursor: pointer; padding: 8px 13px; border-radius: 8px;
  border: 1px solid var(--border); font-size: 13.5px; margin-bottom: 6px;
  display: flex; align-items: flex-start; gap: 10px; transition: all 0.15s;
  background: rgba(0,0,0,0.02);
}
.ds-opt:hover:not(.disabled) { border-color: #7c3aed; background: rgba(124,58,237,0.08); }
.ds-check { width: 22px; height: 22px; border-radius: 5px;
  border: 2px solid var(--muted); flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all 0.15s;
}
.ds-opt.selected .ds-check { border-color: #7c3aed; background: #7c3aed; color: #fff; }
.ds-opt.show-correct { border-color: var(--green); background: rgba(34,197,94,0.1); }
.ds-opt.show-correct .ds-check { border-color: var(--green); background: var(--green); color: #fff; }
.ds-opt.show-wrong { border-color: var(--red); background: rgba(239,68,68,0.1); }
.ds-opt.show-wrong .ds-check { border-color: var(--red); background: var(--red); color: #fff; }
.ds-opt.disabled { cursor: default; }

/* TLN input */
.tln-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.tln-input {
  flex: 1; background: rgba(0,0,0,0.05); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 13px; color: var(--text); font-size: 14px;
  outline: none; transition: border-color 0.15s;
}
.tln-input:focus { border-color: #0891b2; }
.tln-input.correct-input { border-color: var(--green); background: rgba(34,197,94,0.1); }
.tln-input.wrong-input { border-color: var(--red); background: rgba(239,68,68,0.1); }
.tln-input.disabled { cursor: default; }

/* Buttons */
.btn-check {
  background: var(--blue); color: #fff; border: none;
  padding: 9px 18px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: opacity 0.15s; white-space: nowrap;
}
.btn-check:hover { opacity: 0.85; }
.btn-check:disabled { opacity: 0.4; cursor: default; }
.btn-check.ds-btn { background: #7c3aed; }
.btn-check.tln-btn { background: #0891b2; }

/* Solution box */
.solution {
  margin-top: 12px; padding: 12px 14px;
  background: rgba(0,0,0,0.03); border-left: 3px solid var(--blue);
  border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.7;
  display: none; white-space: pre-line;
}
.solution.show { display: block; }
.solution-label { font-size: 10px; font-weight: 700; color: var(--blue);
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.feedback {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; margin-top: 8px;
  padding: 6px 10px; border-radius: 6px;
}
.feedback.ok { background: rgba(34,197,94,0.15); color: var(--green); }
.feedback.err { background: rgba(239,68,68,0.15); color: var(--red); }
.feedback.partial { background: rgba(250,204,21,0.15); color: var(--yellow); }

/* Footer */
.footer-bar {
  background: #080810; padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); flex-shrink: 0;
  font-size: 11px; color: var(--muted);
}
.btn-submit {
  background: linear-gradient(135deg, #16a34a, #15803d);
  color: #fff; border: none; padding: 8px 22px; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-weight: 700; transition: opacity 0.15s;
}
.btn-submit:hover { opacity: 0.88; }
.btn-submit:disabled { opacity: 0.4; cursor: default; }
.result-banner {
  display: none; text-align: center; padding: 30px 20px;
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); margin: 20px 0;
}
.result-banner.show { display: block; }
.result-score { font-size: 52px; font-weight: 800; }
.result-score.high { color: var(--green); }
.result-score.mid  { color: var(--yellow); }
.result-score.low  { color: var(--red); }
.result-msg { font-size: 16px; margin-top: 8px; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <div class="header-info">
    <div class="school">TRƯỜNG THPT NGUYỄN HỮU CẢNH &nbsp;·&nbsp; TỔ TOÁN &nbsp;·&nbsp; NĂM HỌC 2026–2027</div>
    <div class="title">Hệ BPT Bậc Nhất Hai Ẩn</div>

    </div>
    <div class="progress-ring" id="prog-ring">
      <div class="progress-ring-inner" id="prog-pct">0%</div>
    </div>

</div>

<div class="main" id="main-content">
  <div id="quiz-container"></div>
  <div id="result-banner" class="result-banner">
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <div style="margin-top:16px;font-size:13px;color:var(--muted)">
      Hãy xem lại lời giải các câu bên trên để hiểu rõ hơn.
    </div>
  </div>
</div>

<div class="footer-bar">
  <span>TRƯỜNG THPT NGUYỄN HỮU CẢNH — TOÁN 12 — NĂM HỌC 2026–2027</span>
  <button class="btn-submit" id="btn-submit" onclick="submitAll()">Nộp bài & Xem kết quả</button>
</div>

<script>
// ─── Dữ liệu câu hỏi ─────────────────────────────────────────────────────────
const QUESTIONS = [{"type": "tn", "number": 1, "stem": "Hệ bất phương trình nào sau đây là hệ bất phương trình bậc nhất hai ẩn?", "solution": "Định nghĩa hệ BPT bậc nhất hai ẩn<br/> Hệ phải chỉ gồm các bất phương trình có bậc cao nhất là <strong style=\"color: #ec4899;\">1</strong>, và chỉ có đúng <strong style=\"color: #2dd4bf;\">2</strong> ẩn $x, y$.<br/> <br/> Phân tích đáp án<br/> - Đáp án A: Có chứa $x^2$ (bậc <strong style=\"color: #2dd4bf;\">2</strong>) $\\rightarrow$ Loại.<br/> - Đáp án C: Có chứa $x y$ (bậc <strong style=\"color: #2dd4bf;\">2</strong>) $\\rightarrow$ Loại.<br/> - Đáp án D: Có <strong style=\"color: #fbbf24;\">3</strong> ẩn $x, y, z$ $\\rightarrow$ Loại.<br/> - Đáp án B: Chỉ chứa các số hạng $x, y$ bậc <strong style=\"color: #ec4899;\">1</strong> $\\rightarrow$ Đúng.", "options": ["$\\begin{cases} x^2 + y \\le 1 \\\\ 2x - y > 0 \\end{cases}$", "$\\begin{cases} 2x + 3y > 5 \\\\ x - y \\le 1 \\end{cases}$", "$\\begin{cases} x y + y \\le 2 \\\\ x - 3 \\ge 0 \\end{cases}$", "$\\begin{cases} x + y + z \\le 3 \\\\ 2x - y > 1 \\end{cases}$"], "correct": [1]}, {"type": "tn", "number": 2, "stem": "Cặp số $(1; 1)$ là nghiệm của hệ bất phương trình nào sau đây?", "solution": "Phương pháp<br/> Thay $(1;1)$ vào từng hệ, nếu thoả mãn TẤT CẢ các BPT trong hệ thì nó là nghiệm của hệ đó.<br/> <br/> Kiểm tra từng đáp án<br/> - Đáp án A: $1 + 1 = 2 > 3$ (Sai) $\\rightarrow$ Loại.<br/> - Đáp án B: $1 - 1 = 0 > 0$ (Sai) $\\rightarrow$ Loại.<br/> - Đáp án D: $3(1) - 1 = 2 \\ge 5$ (Sai) $\\rightarrow$ Loại.<br/> - Đáp án C: $2(1) + 1 = 3 \\le 4$ (Đúng) và $1 - 3(1) = -2 < 0$ (Đúng) $\\rightarrow$ Thoả mãn.", "options": ["$\\begin{cases} x + y > 3 \\\\ 2x - y < 0 \\end{cases}$", "$\\begin{cases} x - y > 0 \\\\ x + 2y \\le 3 \\end{cases}$", "$\\begin{cases} 2x + y \\le 4 \\\\ x - 3y < 0 \\end{cases}$", "$\\begin{cases} 3x - y \\ge 5 \\\\ x + y \\le 2 \\end{cases}$"], "correct": [2]}, {"type": "tn", "number": 3, "stem": "Điểm $M(0; -3)$ thuộc miền nghiệm của hệ bất phương trình nào?", "solution": "Thế toạ độ<br/> Ta thay hoành độ $x=0$, tung độ $y=-3$ vào từng hệ.<br/> <br/> Kiểm tra<br/> - Hệ A: $2(0) - (-3) = 3 \\ge 1$ (Đúng) và $0 + (-3) = -3 \\le 2$ (Đúng).<br/> Vậy $(0; -3)$ thoả mãn cả <strong style=\"color: #2dd4bf;\">2</strong> BPT của Hệ A.<br/> - Kiểm tra thêm Hệ B: $0 - 2(-3) = 6 < 5$ (Sai).<br/> - Hệ C: $y = -3 \\le -4$ (Sai).<br/> - Hệ D: $2(0) + 3(-3) = -9 > 1$ (Sai).", "options": ["$\\begin{cases} 2x - y \\ge 1 \\\\ x + y \\le 2 \\end{cases}$", "$\\begin{cases} x - 2y < 5 \\\\ x + 3y > 0 \\end{cases}$", "$\\begin{cases} x \\ge 0 \\\\ y \\le -4 \\end{cases}$", "$\\begin{cases} -x + y < 0 \\\\ 2x + 3y > 1 \\end{cases}$"], "correct": [0]}, {"type": "tn", "number": 4, "stem": "Miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 2 \\end{cases}$ là hình gì?", "solution": "Vẽ hình phân tích<br/> <br/> #context cetz.canvas({<br/> import cetz.draw: *<br/> let sc = <strong style=\"color: #60a5fa;\">0.8</strong><br/> line((-<strong style=\"color: #ec4899;\">1</strong><strong>sc, <strong style=\"color: #2dd4bf;\">0</strong>), (<strong style=\"color: #fbbf24;\">3</strong></strong>sc, <strong style=\"color: #2dd4bf;\">0</strong>), mark: (end: \"stealth\"))<br/> line((<strong style=\"color: #2dd4bf;\">0</strong>, -<strong style=\"color: #ec4899;\">1</strong><strong>sc), (<strong style=\"color: #2dd4bf;\">0</strong>, <strong style=\"color: #fbbf24;\">3</strong></strong>sc), mark: (end: \"stealth\"))<br/> line((<strong style=\"color: #2dd4bf;\">0</strong>, <strong style=\"color: #2dd4bf;\">2</strong><strong>sc), (<strong style=\"color: #2dd4bf;\">2</strong></strong>sc, <strong style=\"color: #2dd4bf;\">0</strong>), stroke: blue + <strong style=\"color: #ec4899;\">1</strong>.2pt)<br/> line((<strong style=\"color: #2dd4bf;\">0</strong>,<strong style=\"color: #2dd4bf;\">0</strong>), (<strong style=\"color: #2dd4bf;\">2</strong><strong>sc,<strong style=\"color: #2dd4bf;\">0</strong>), (<strong style=\"color: #2dd4bf;\">0</strong>,<strong style=\"color: #2dd4bf;\">2</strong></strong>sc), close: true, fill: rgb(<strong style=\"color: #60a5fa;\">173</strong>, <strong style=\"color: #a855f7;\">216</strong>, <strong style=\"color: #fbbf24;\">230</strong>, <strong style=\"color: #f87171;\">100</strong>), stroke: none)<br/> content((<strong style=\"color: #2dd4bf;\">2</strong><strong>sc, -<strong style=\"color: #fbbf24;\">0.4</strong></strong>sc), [$2$])<br/> content((-<strong style=\"color: #fbbf24;\">0.4</strong><strong>sc, <strong style=\"color: #2dd4bf;\">2</strong></strong>sc), [$2$])<br/> })<br/> <br/> Kết luận<br/> Phần mặt phẳng không bị gạch tạo thành tam giác vuông được giới hạn bởi <strong style=\"color: #fbbf24;\">3</strong> đỉnh: $(0;0), (2;0)$ và $(0;2)$.", "options": ["Một nửa mặt phẳng", "Một đoạn thẳng", "Một tam giác", "Một tứ giác"], "correct": [2]}, {"type": "tn", "number": 5, "stem": "Tìm giá trị lớn nhất $F_\\max$ của hàm mục tiêu $F(x,y) = x + 3y$ trên đa giác giới hạn bởi các đỉnh $A(0;0), B(3;0), C(2;4), D(0;2)$.", "solution": "Phương pháp<br/> Theo Định lý cực trị trên miền đa giác, giá trị lớn nhất/nhỏ nhất luôn đạt được tại một trong các đỉnh của miền.<br/> <br/> Tính toán giá trị tại các đỉnh<br/> - Tại $A(0;0)$: $F = 0 + 3(0) = 0$.<br/> - Tại $B(3;0)$: $F = 3 + 3(0) = 3$.<br/> - Tại $C(2;4)$: $F = 2 + 3(4) = 14$.<br/> - Tại $D(0;2)$: $F = 0 + 3(2) = 6$.<br/> <br/> Kết luận<br/> So sánh <strong style=\"color: #fbbf24;\">4</strong> giá trị trên, ta có $F_\\max = 14$, đạt được tại điểm $C(2;4)$.", "options": ["$9$", "<strong style=\"color: #34d399;\">14</strong>", "<strong style=\"color: #34d399;\">12</strong>", "<strong style=\"color: #34d399;\">6</strong>"], "correct": [1]}, {"type": "tn", "number": 6, "stem": "Tìm giá trị nhỏ nhất của $F = 2x - y$ trên tam giác có các đỉnh $O(0;0), M(0;5), N(4;0)$.", "solution": "Tính hàm mục tiêu tại các đỉnh<br/> - Tại $O(0;0)$: $F(0,0) = 2(0) - 0 = 0$.<br/> - Tại $M(0;5)$: $F(0,5) = 2(0) - 5 = -5$.<br/> - Tại $N(4;0)$: $F(4,0) = 2(4) - 0 = 8$.<br/> <br/> Kết luận<br/> Số nhỏ nhất trong các kết quả là $-5$. Vậy $F_\\min = -5$ đạt được tại $M(0;5)$.", "options": ["-<strong style=\"color: #f87171;\">5</strong>", "<strong style=\"color: #2dd4bf;\">0</strong>", "<strong style=\"color: #ec4899;\">8</strong>", "<strong style=\"color: #fbbf24;\">3</strong>"], "correct": [0]}, {"type": "tn", "number": 7, "stem": "Một xưởng cần làm bàn ($x$) và ghế ($y$). <strong style=\"color: #ec4899;\">1</strong> bàn cần <strong style=\"color: #2dd4bf;\">2</strong> giờ mộc, <strong style=\"color: #ec4899;\">1</strong> giờ sơn. <strong style=\"color: #ec4899;\">1</strong> ghế cần <strong style=\"color: #ec4899;\">1</strong> giờ mộc, <strong style=\"color: #ec4899;\">1</strong> giờ sơn. Tổng số giờ mộc tối đa là <strong style=\"color: #ec4899;\">40</strong>, giờ sơn tối đa là <strong style=\"color: #a855f7;\">30</strong>. Hệ BPT nào là đúng?", "solution": "Thiết lập điều kiện<br/> - Thời gian làm mộc: $2x$ cho bàn, $y$ cho ghế $\\rightarrow 2x + y \\le 40$.<br/> - Thời gian sơn: $x$ cho bàn, $y$ cho ghế $\\rightarrow x + y \\le 30$.<br/> - Số lượng sản phẩm không thể âm: $x \\ge 0, y \\ge 0$.<br/> Kết hợp lại, ta được hệ ở đáp án A.", "options": ["$\\begin{cases} 2x + y \\le 40 \\\\ x + y \\le 30 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$", "$\\begin{cases} x + 2y \\le 40 \\\\ x + y \\le 30 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$", "$\\begin{cases} 2x + y \\ge 40 \\\\ x + y \\ge 30 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$", "$\\begin{cases} x + y \\le 40 \\\\ 2x + y \\le 30 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$"], "correct": [0]}, {"type": "tn", "number": 8, "stem": "Với hệ $\\begin{cases} x\\ge0 \\\\ y\\ge0 \\\\ x+y\\le3 \\end{cases}$, hàm số nào sau đây đạt GTLN bằng <strong style=\"color: #ec4899;\">9</strong> tại đa giác nghiệm?", "solution": "Xác định đỉnh<br/> Miền nghiệm là tam giác với <strong style=\"color: #fbbf24;\">3</strong> đỉnh: $O(0;0), A(3;0), B(0;3)$.<br/> Thử hàm mục tiêu<br/> - Đáp án A: $\\max(F) = 3$ tại A và B.<br/> - Đáp án B: $\\max(F) = 2(3)+0 = 6$ tại A.<br/> - Đáp án C: $\\max(F) = 3(3)+0 = 9$ tại A.<br/> - Đáp án D: $\\max(F) = 3(3)+3(0) = 9$ tại A (và B, vì trên cả đoạn AB thì $3x+3y=3(x+y)=9$).<br/> <strong>Lưu ý:</strong> Cả C và D đều đạt max bằng <strong style=\"color: #ec4899;\">9</strong>. Tuy nhiên, xét tính phổ biến thì chọn D (hoặc C đều được, ta chọn D).", "options": ["$F = x+y$", "$F = 2x+y$", "$F = 3x+y$", "$F = 3x+3y$"], "correct": [3]}, {"type": "tn", "number": 9, "stem": "Miền đa giác $x \\ge 0, y \\ge 0, 2x + y \\le 4, x + y \\le 3$ có mấy đỉnh?", "solution": "Tìm toạ độ đỉnh<br/> Hệ tạo bởi các đường thẳng: $x=0$, $y=0$, $2x+y=4$, $x+y=3$.<br/> - Giao Ox và Oy: $O(0;0)$.<br/> - Giao Ox và $2x+y=4$: $(2;0)$ (vì nó bé hơn đỉnh giao với $x+y=3$ là $(3;0)$). $A(2;0)$.<br/> - Giao Oy và $x+y=3$: $(0;3)$ (bé hơn đỉnh giao với $2x+y=4$ là $(0;4)$). $B(0;3)$.<br/> - Giao của $2x+y=4$ và $x+y=3$: Trừ hai pt ta có $x=1, y=2$. Điểm này thoả mãn toàn bộ hệ nên là một đỉnh $C(1;2)$.<br/> Kết luận<br/> Đa giác có <strong style=\"color: #fbbf24;\">4</strong> đỉnh: $O, A, B, C$ nên là tứ giác.", "options": ["<strong style=\"color: #fbbf24;\">3</strong>", "<strong style=\"color: #fbbf24;\">4</strong>", "<strong style=\"color: #f87171;\">5</strong>", "<strong style=\"color: #34d399;\">6</strong>"], "correct": [1]}, {"type": "tn", "number": 10, "stem": "Nếu miền đa giác bị hở (không bị chặn), điều gì có thể xảy ra?", "solution": "Lý thuyết<br/> Khi miền nghiệm không bị chặn (ví dụ chỉ có đk $x+y\\ge2, x\\ge0, y\\ge0$), các biến $x, y$ có thể tiến ra dương vô cực.<br/> Lúc này hàm $F(x,y) = x+y$ sẽ không có giá trị lớn nhất (tiến tới $+\\infty$). Do đó mệnh đề C là đầy đủ nhất.", "options": ["Không có giá trị lớn nhất", "Không có giá trị nhỏ nhất", "Cả A và B đều đúng", "Luôn có cực trị"], "correct": [2]}, {"type": "tn", "number": 11, "stem": "Điểm nào không thuộc miền nghiệm của hệ $\\begin{cases} x + y < 5 \\\\ x - y \\ge 0 \\end{cases}$?", "solution": "Kiểm tra BPT <strong style=\"color: #2dd4bf;\">2</strong>: $x - y \\ge 0$ (hay $x \\ge y$)<br/> - $(2;1)$: $2 \\ge 1$ (Đúng).<br/> - $(3;1)$: $3 \\ge 1$ (Đúng).<br/> - $(4;0)$: $4 \\ge 0$ (Đúng).<br/> - $(1;3)$: $1 \\ge 3$ (Sai).<br/> Vậy $(1; 3)$ không thuộc miền nghiệm, ta có thể kết luận ngay không cần thử BPT <strong style=\"color: #ec4899;\">1</strong>.", "options": ["$(2; 1)$", "$(3; 1)$", "$(4; 0)$", "$(1; 3)$"], "correct": [3]}, {"type": "tn", "number": 12, "stem": "Để sản xuất một loại áo cần 2m vải cotton và 1m vải lanh. Một áo loại khác cần 1m cotton và 2m lanh. Kho chỉ còn 10m mỗi loại. Gọi $x, y$ là số áo mỗi loại. Hệ nào đúng?", "solution": "Giới hạn Vải cotton<br/> Áo loại <strong style=\"color: #ec4899;\">1</strong> tốn $2x$, loại <strong style=\"color: #2dd4bf;\">2</strong> tốn $y$. Tổng $2x + y \\le 10$.<br/> Giới hạn Vải lanh<br/> Áo loại <strong style=\"color: #ec4899;\">1</strong> tốn $x$, loại <strong style=\"color: #2dd4bf;\">2</strong> tốn $2y$. Tổng $x + 2y \\le 10$.<br/> Và dĩ nhiên $x\\ge0, y\\ge0$. Hệ B là đáp án chính xác.", "options": ["$\\begin{cases} x+y\\le10 \\\\ 2x+y\\le10 \\\\ x\\ge0 \\\\ y\\ge0 \\end{cases}$", "$\\begin{cases} 2x+y\\le10 \\\\ x+2y\\le10 \\\\ x\\ge0 \\\\ y\\ge0 \\end{cases}$", "$\\begin{cases} 2x+y\\ge10 \\\\ x+2y\\ge10 \\\\ x\\ge0 \\\\ y\\ge0 \\end{cases}$", "$\\begin{cases} x+y\\ge10 \\\\ 2x+2y\\le10 \\\\ x\\ge0 \\\\ y\\ge0 \\end{cases}$"], "correct": [1]}, {"type": "ds", "number": 13, "stem": "Cho hệ bất phương trình $\\begin{cases} x - y > 0 \\\\ 2x + y \\le 6 \\end{cases}$. Xét tính đúng sai của các mệnh đề:", "solution": "Phân tích từng mệnh đề<br/> - a) Thay $(0;0)$ vào BPT <strong style=\"color: #ec4899;\">1</strong>: $0 - 0 = 0 > 0$ (Sai). $\\rightarrow$ Mệnh đề SAI.<br/> - b) Thay $(2;1)$: BPT <strong style=\"color: #ec4899;\">1</strong> $2 - 1 = 1 > 0$ (Đúng). BPT <strong style=\"color: #2dd4bf;\">2</strong> $2(2)+1 = 5 \\le 6$ (Đúng). $\\rightarrow$ Mệnh đề ĐÚNG.<br/> - c) Hệ chỉ có <strong style=\"color: #2dd4bf;\">2</strong> bờ, không bị chặn bởi các đường khác như $x\\ge0, y\\ge0$, do đó nó mở ra tới vô tận. $\\rightarrow$ Mệnh đề SAI.<br/> - d) BPT <strong style=\"color: #2dd4bf;\">2</strong> có dấu $\\le$ nên lấy đường bờ $2x+y=6$. $\\rightarrow$ Mệnh đề ĐÚNG.", "options": ["Hệ có chứa gốc toạ độ $O(0;0)$.", "Điểm $A(2; 1)$ là một nghiệm của hệ.", "Miền nghiệm là một đa giác khép kín.", "Biên của miền nghiệm bao gồm đường $2x+y=6$."], "correct": []}, {"type": "ds", "number": 14, "stem": "Bài toán: Một cửa hàng bán gạo và ngô. Bán 1kg gạo lãi 5k, 1kg ngô lãi 3k. Cửa hàng chỉ nhập tối đa 100kg mỗi ngày, và số gạo bán ra luôn lớn hơn hoặc bằng số ngô. Kí hiệu $x, y$ là kg gạo và ngô.", "solution": "Giải thích chi tiết<br/> - a) Tổng lượng nhập là $x+y$. BPT: $x+y\\le100$. (ĐÚNG)<br/> - b) Gạo lớn hơn hoặc bằng ngô: $x \\ge y \\Leftrightarrow x - y \\ge 0$. (SAI, vì cho $x-y\\le0$)<br/> - c) Lợi nhuận $5k * x + 3k * y$. Hàm F là đúng. (ĐÚNG)<br/> - d) Giải bài toán tối ưu: Tại $A_{100}^{0}$, $F = 500k$. Tại $B(50,50)$, $F = 5(50)+3(50) = 400k$. Vậy bán 100kg gạo mang lại lợi nhuận cao nhất. (SAI)", "options": ["Điều kiện tổng số kg là $x + y \\le 100$.", "Điều kiện tỉ lệ là $x - y \\le 0$.", "Hàm lợi nhuận là $F = 5x + 3y$.", "Để tối đa lợi nhuận, cần bán 50kg gạo, 50kg ngô."], "correct": []}, {"type": "ds", "number": 15, "stem": "Cho đa giác miền nghiệm có <strong style=\"color: #fbbf24;\">3</strong> đỉnh $O(0;0), A(5;0), B(0;4)$.", "solution": "Đánh giá các ý<br/> - a) Đây là tam giác vuông. $S = \\dfrac{1}{2} * 5 * 4 = 10$. (ĐÚNG)<br/> - b) Tại A: $5+0=5$. Tại B: $0+4=4$. Max là <strong style=\"color: #f87171;\">5</strong>. (ĐÚNG)<br/> - c) Tại A: $2(5)+3(0)=10$. Tại B: $2(0)+3(4)=12$. Max là <strong style=\"color: #34d399;\">12</strong>, không phải <strong style=\"color: #60a5fa;\">10</strong>. (SAI)<br/> - d) Đường thẳng AB có pt $\\dfrac{x}{5} + \\dfrac{y}{4} = 1 \\Leftrightarrow 4x + 5y = 20$. Tại $(2;2): 4(2)+5(2) = 18 < 20$. Nên điểm nằm dưới đường AB, và nằm ở phần $x>0, y>0$. Vậy nó nằm trong tam giác. (ĐÚNG)", "options": ["Diện tích đa giác này bằng <strong style=\"color: #60a5fa;\">10</strong>.", "Với $F = x + y$, thì $F_\\max = 5$.", "Với $F = 2x + 3y$, thì $F_\\max = 10$.", "Điểm $(2;2)$ nằm bên trong đa giác này."], "correct": []}, {"type": "ds", "number": 16, "stem": "Khẳng định về việc giải hệ BPT bậc nhất hai ẩn:", "solution": "Kiểm tra lý thuyết<br/> - a) Có những hệ vô nghiệm, ví dụ $x>1, x\\leftarrow1$. (SAI)<br/> - b) $x=2$ là đường thẳng song song trục Oy, vuông góc Ox. (ĐÚNG)<br/> - c) Hệ có thể co về <strong style=\"color: #ec4899;\">1</strong> điểm, ví dụ $x+y\\le0, x\\ge0, y\\ge0$ có nghiệm duy nhất $(0;0)$. (ĐÚNG)<br/> - d) Đúng theo quy tắc vẽ miền nghiệm: điểm không thoả mãn -&gt; gạch bỏ miền chứa nó. (ĐÚNG)", "options": ["Mọi hệ BPT đều luôn có miền nghiệm.", "Để vẽ biên $x=2$, vẽ đường thẳng vuông góc với trục Ox.", "Có thể có trường hợp đa giác nghiệm chỉ là một điểm duy nhất.", "Nếu <strong style=\"color: #ec4899;\">1</strong> điểm làm cho BPT vô lý, ta gạch bỏ phần mặt phẳng chứa điểm đó."], "correct": []}, {"type": "tln", "number": 17, "stem": "Có bao nhiêu điểm nguyên có toạ độ $(x; y)$ thoả mãn hệ $\\begin{cases} x \\ge 1 \\\\ y \\ge 1 \\\\ x + y \\le 4 \\end{cases}$?", "solution": "Liệt kê toạ độ nguyên<br/> - $x = 1 \\rightarrow 1 + y \\le 4 \\rightarrow y \\le 3$. Các điểm: $(1;1), (1;2), (1;3)$ (<strong style=\"color: #fbbf24;\">3</strong> điểm).<br/> - $x = 2 \\rightarrow 2 + y \\le 4 \\rightarrow y \\le 2$. Các điểm: $(2;1), (2;2)$ (<strong style=\"color: #2dd4bf;\">2</strong> điểm).<br/> - $x = 3 \\rightarrow 3 + y \\le 4 \\rightarrow y \\le 1$. Các điểm: $(3;1)$ (<strong style=\"color: #ec4899;\">1</strong> điểm).<br/> Tổng số điểm là: $3 + 2 + 1 = 6$ điểm.", "answer": "6"}, {"type": "tln", "number": 18, "stem": "Tìm giá trị lớn nhất của $F = 4x + 5y$ trên đa giác $A(0;0), B(3;0), C(2;2), D(0;4)$.", "solution": "Thay toạ độ các đỉnh vào hàm F<br/> - Tại $A(0;0): F = 0$.<br/> - Tại $B(3;0): F = 4(3) + 0 = 12$.<br/> - Tại $C(2;2): F = 4(2) + 5(2) = 8 + 10 = 18$.<br/> - Tại $D(0;4): F = 0 + 5(4) = 20$.<br/> Giá trị lớn nhất là <strong style=\"color: #60a5fa;\">20</strong>.", "answer": "20"}, {"type": "tln", "number": 19, "stem": "Một khu vườn hình tam giác có các đỉnh trên bản đồ $O(0;0), A(4;0), B(0;6)$. Tính diện tích khu vườn (đơn vị diện tích).", "solution": "Phân tích hình học<br/> Tam giác OAB có đỉnh O(<strong style=\"color: #2dd4bf;\">0</strong>;<strong style=\"color: #2dd4bf;\">0</strong>) và <strong style=\"color: #2dd4bf;\">2</strong> đỉnh nằm trên <strong style=\"color: #2dd4bf;\">2</strong> trục toạ độ $\\rightarrow$ OAB là tam giác vuông tại O.<br/> Cạnh góc vuông $O A = 4$. Cạnh góc vuông $O B = 6$.<br/> <br/> Tính diện tích<br/> $S = \\dfrac{1}{2} O A * O B = \\dfrac{1}{2} * 4 * 6 = 12$.", "answer": "12"}, {"type": "tln", "number": 20, "stem": "Người ta cần thuê xe chở <strong style=\"color: #ec4899;\">140</strong> người và <strong style=\"color: #ec4899;\">9</strong> tấn hàng. Xe lớn chở được <strong style=\"color: #ec4899;\">40</strong> người, <strong style=\"color: #fbbf24;\">3</strong> tấn hàng (giá <strong style=\"color: #fbbf24;\">4</strong> triệu/chuyến). Xe nhỏ chở <strong style=\"color: #60a5fa;\">20</strong> người, <strong style=\"color: #ec4899;\">1</strong> tấn hàng (giá <strong style=\"color: #2dd4bf;\">2</strong> triệu/chuyến). Gọi $x, y$ là số xe lớn và xe nhỏ. Điều kiện để chở hết <strong style=\"color: #ec4899;\">140</strong> người là $40x + 20y \\ge 140$. Viết hệ số $a, b$ nhỏ nhất (chia nguyên dương cho <strong style=\"color: #60a5fa;\">20</strong>) của BPT này. Tính $a+b$.", "solution": "Rút gọn BPT<br/> $40x + 20y \\ge 140$. Chia cả <strong style=\"color: #2dd4bf;\">2</strong> vế cho <strong style=\"color: #60a5fa;\">20</strong> ta được:<br/> $2x + y \\ge 7$.<br/> Hệ số của $x$ là $a = 2$, hệ số của $y$ là $b = 1$.<br/> Vậy $a + b = 2 + 1 = 3$.", "answer": "3"}, {"type": "tln", "number": 21, "stem": "Tiếp tục bài <strong style=\"color: #60a5fa;\">20</strong>, biết bãi xe có <strong style=\"color: #60a5fa;\">10</strong> xe lớn và <strong style=\"color: #ec4899;\">9</strong> xe nhỏ. Hàm chi phí là $F = 4x + 2y$ (triệu đồng). Hệ BPT hoàn chỉnh có bao nhiêu đỉnh?", "solution": "Thiết lập hệ<br/> Số người: $2x + y \\ge 7$.<br/> Số hàng: $3x + y \\ge 9$.<br/> Giới hạn xe: $0 \\le x \\le 10$ và $0 \\le y \\le 9$.<br/> Phân tích đa giác<br/> Biểu diễn hệ này trên mặt phẳng, ta thấy các đường cắt nhau tạo ra <strong style=\"color: #f87171;\">5</strong> đỉnh tạo thành một ngũ giác khép kín giới hạn miền nghiệm.", "answer": "5"}, {"type": "tln", "number": 22, "stem": "Tìm $m$ lớn nhất để điểm $(1; m)$ thoả mãn $x - y > 0$, biết $m$ là số nguyên.", "solution": "Giải BPT<br/> Thay $(1; m)$ vào BPT: $1 - m > 0 \\Leftrightarrow m < 1$.<br/> <br/> Lập luận<br/> Vì $m$ là số nguyên nên các giá trị $m$ có thể là $0, -1, -2, dots$.<br/> Giá trị lớn nhất trong số các nghiệm nguyên này là $0$.", "answer": "0"}];

  const api = getAPI();
  if (!api) return;
  api.LMSSetValue("cmi.core.score.raw", String(Math.round(score)));
  api.LMSSetValue("cmi.core.score.min", "0");
  api.LMSSetValue("cmi.core.score.max", "10");
  api.LMSSetValue("cmi.core.lesson_status", score >= 5 ? "passed" : "failed");
  api.LMSCommit("");
  api.LMSFinish("");
}

// ─── Render câu hỏi ──────────────────────────────────────────────────────────
function renderAll() {
  const container = document.getElementById('quiz-container');
  let html = '';
  let curSection = '';

  QUESTIONS.forEach((q, i) => {
    // Section header
    const sectionMap = { tn: 'PHẦN I — Trắc Nghiệm (ABCD)', ds: 'PHẦN II — Đúng / Sai', tln: 'PHẦN III — Trả Lời Ngắn' };
    const sec = sectionMap[q.type];
    if (sec !== curSection) {
      html += `<div class="section-header">${sec}</div>`;
      curSection = sec;
    }

    html += `<div class="card" id="card-${i}">`;
    html += `<div class="q-header">`;
    html += `<span class="q-num ${q.type}-type">Câu ${q.number}</span>`;
    html += `<div class="q-stem">${q.stem}</div>`;
    html += `</div>`;

    if (q.type === 'tn') {
      html += renderTN(q, i);
    } else if (q.type === 'ds') {
      html += renderDS(q, i);
    } else {
      html += renderTLN(q, i);
    }

    // Solution
    html += `<div class="solution" id="sol-${i}">`;
    html += `<div class="solution-label">📝 Lời giải</div>`;
    const solText = q.solution ? q.solution.replace(/\n/g, '<br/>') : '(Xem trong tài liệu)';
    html += `<div style="line-height: 1.6;">${solText}</div>`;
    html += `</div>`;

    html += `</div>`;
  });

  container.innerHTML = html;
  // Init DS state
  QUESTIONS.forEach((q, i) => {
    if (q.type === 'ds') state.ds[i] = new Set();
  });
};

function renderTN(q, i) {
  const labels = ['A','B','C','D'];
  let html = '<div class="options">';
  q.options.forEach((opt, j) => {
    html += `<div class="opt" id="opt-${i}-${j}" onclick="selectTN(${i},${j})">
      <div class="label">${labels[j]}</div>
      <div>${opt}</div>
    </div>`;
  });
  html += '</div>';
  html += `<div style="text-align:right;margin-top:10px">
    <button class="btn-check" id="btn-${i}" onclick="checkTN(${i})">Kiểm tra</button>
  </div>`;
  html += `<div class="feedback" id="fb-${i}" style="display:none"></div>`;
  return html;
};

function renderDS(q, i) {
  const labels = ['a','b','c','d'];
  let html = '<div style="margin-top:8px">';
  q.options.forEach((opt, j) => {
    html += `<div class="ds-opt" id="dsopt-${i}-${j}" onclick="toggleDS(${i},${j})">
      <div class="ds-check" id="dschk-${i}-${j}"></div>
      <div><strong>${labels[j]}</strong>) ${opt}</div>
    </div>`;
  });
  html += '</div>';
  html += `<div style="text-align:right;margin-top:10px">
    <button class="btn-check ds-btn" id="btn-${i}" onclick="checkDS(${i})">Kiểm tra</button>
  </div>`;
  html += `<div class="feedback" id="fb-${i}" style="display:none"></div>`;
  return html;
};

function renderTLN(q, i) {
  return `<div class="tln-row">
    <input class="tln-input" id="tln-${i}" placeholder="Nhập đáp án..." oninput="state.tln[${i}]=this.value"/>
    <button class="btn-check tln-btn" id="btn-${i}" onclick="checkTLN(${i})">Kiểm tra</button>
  </div>
  <div class="feedback" id="fb-${i}" style="display:none"></div>`;
};

// ─── Interaction ────────────────────────────────────────────────────────────────────────────
function selectTN(qi, oi) {
  if (state.checked[qi] || submitted) return;
  const prev = state.tn[qi];
  if (prev !== undefined) document.getElementById(`opt-${qi}-${prev}`).classList.remove('selected');
  state.tn[qi] = oi;
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
};

function toggleDS(qi, oi) {
  if (state.checked[qi] || submitted) return;
  const s = state.ds[qi];
  const el = document.getElementById(`dsopt-${qi}-${oi}`);
  const chk = document.getElementById(`dschk-${qi}-${oi}`);
  if (s.has(oi)) { s.delete(oi); el.classList.remove('selected'); chk.textContent = ''; }
  else           { s.add(oi);    el.classList.add('selected');    chk.textContent = '✓'; }
};

function checkTN(qi) {
  if (state.checked[qi] || submitted) return;
  const q = QUESTIONS[qi];
  const sel = state.tn[qi];
  if (sel === undefined) { alert('Bạn chưa chọn đáp án!'); return; }
  state.checked[qi] = true;

  const isCorrect = q.correct.includes(sel);
  state.points[qi] = isCorrect ? 1 : 0;

  q.options.forEach((_, j) => {
    const el = document.getElementById(`opt-${qi}-${j}`);
    el.classList.add('disabled');
    if (q.correct.includes(j)) el.classList.add('show-correct');
    else if (j === sel && !isCorrect) el.classList.add('show-wrong');
  });

  const fb = document.getElementById(`fb-${qi}`);
  fb.style.display = 'flex';
  fb.className = `feedback ${isCorrect ? 'ok' : 'err'}`;
  fb.innerHTML = isCorrect ? '✅ Chính xác!' : `❌ Sai. Đáp án đúng: ${['A','B','C','D'][q.correct[0]]}`;

  document.getElementById(`sol-${qi}`).classList.add('show');
  document.getElementById(`btn-${qi}`).disabled = true;
  document.getElementById(`card-${qi}`).classList.add(isCorrect ? 'correct' : 'wrong');
  document.getElementById(`card-${qi}`).classList.add('answered');
  setTimeout(() => { fb.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 100);
  updateProgress();
};


function checkDS(qi) {
  if (state.checked[qi] || submitted) return;
  const q = QUESTIONS[qi];
  const sel = state.ds[qi];
  if (sel.size === 0) { alert('Bạn chưa chọn mệnh đề nào!'); return; }
  state.checked[qi] = true;

  const correctSet = new Set(q.correct);
  let correct_cnt = 0;
  q.options.forEach((_, j) => {
    const el = document.getElementById(`dsopt-${qi}-${j}`);
    const chk = document.getElementById(`dschk-${qi}-${j}`);
    el.classList.add('disabled');
    const userSel = sel.has(j);
    const isCor = correctSet.has(j);
    if (isCor && userSel) { el.classList.add('show-correct'); correct_cnt++; }
    else if (isCor && !userSel) { el.classList.add('show-correct'); chk.textContent = '✓'; }
    else if (!isCor && userSel) { el.classList.add('show-wrong'); }
  });

  const total = q.correct.length;
  const pts = correct_cnt === total && sel.size === total ? 1
            : correct_cnt >= Math.ceil(total*0.75) ? 0.75
            : correct_cnt >= Math.ceil(total*0.5) ? 0.5
            : correct_cnt >= 1 ? 0.25 : 0;
  state.points[qi] = pts;

  const fb = document.getElementById(`fb-${qi}`);
  fb.style.display = 'flex';
  fb.className = `feedback ${pts === 1 ? 'ok' : pts >= 0.5 ? 'partial' : 'err'}`;
  fb.innerHTML = pts === 1 ? `✅ Hoàn toàn đúng! (${correct_cnt}/${total})` : `⚠️ Đúng ${correct_cnt}/${total} mệnh đề`;

  document.getElementById(`sol-${qi}`).classList.add('show');
  document.getElementById(`btn-${qi}`).disabled = true;
  document.getElementById(`card-${qi}`).classList.add(pts === 1 ? 'correct' : pts > 0 ? 'answered' : 'wrong');
  updateProgress();
};

function checkTLN(qi) {
  if (state.checked[qi] || submitted) return;
  const q = QUESTIONS[qi];
  const inp = document.getElementById(`tln-${qi}`);
  const userVal = (state.tln[qi] || inp.value).trim();
  if (!userVal) { alert('Bạn chưa nhập đáp án!'); return; }
  state.checked[qi] = true;

  // So sánh thông minh hơn: normalize unicode, số học, phân số
  function normalizeTLN(s) {
    return s
      .replace(/\$/g, '')           // loại bỏ $
      .replace(/−/g, '-')       // unicode minus − → -
      .replace(/·/g, '.')       // · → .
      .replace(/,/g, '.')            // dấu phẩy (số thập phân Việt) → .
      .replace(/\s+/g, '')          // bỏ whitespace
      .toLowerCase();
  }
  function tryNumeric(s) {
    // Cố gắng đọc dưới dạng số thập phân
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  function tryFraction(s) {
    // Hỗ trợ dạng a/b → số
    const m = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
    if (m) return parseFloat(m[1]) / parseFloat(m[2]);
    return null;
  }

  const normExpected = normalizeTLN(q.answer);
  const normActual   = normalizeTLN(userVal);

  let isCorrect = (normActual === normExpected);
  if (!isCorrect) {
    // So sánh số học với sai số nhỏ (1e-9)
    const numE = tryFraction(normExpected) ?? tryNumeric(normExpected);
    const numA = tryFraction(normActual)   ?? tryNumeric(normActual);
    if (numE !== null && numA !== null) {
      isCorrect = Math.abs(numE - numA) < 1e-9;
    }
  }
  state.points[qi] = isCorrect ? 1 : 0;

  inp.classList.add(isCorrect ? 'correct-input' : 'wrong-input');
  inp.classList.add('disabled');
  inp.readOnly = true;

  const fb = document.getElementById(`fb-${qi}`);
  fb.style.display = 'flex';
  fb.className = `feedback ${isCorrect ? 'ok' : 'err'}`;
  if (isCorrect) {
    fb.innerHTML = '✅ Đúng rồi!';
  } else {
    fb.innerHTML = `❌ Chưa đúng. Đáp án: <span id="tln-ans-${qi}">${q.answer}</span>`;
    // Re-render KaTeX cho đáp án
    try {
      const ansEl = document.getElementById(`tln-ans-${qi}`);
      if (ansEl && window.renderMathInElement) renderMathInElement(ansEl);
    } catch(e) {}
  }

  document.getElementById(`sol-${qi}`).classList.add('show');
  document.getElementById(`btn-${qi}`).disabled = true;
  document.getElementById(`card-${qi}`).classList.add(isCorrect ? 'correct' : 'wrong');
  document.getElementById(`card-${qi}`).classList.add('answered');
  // Auto-scroll đến feedback
  setTimeout(() => { fb.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 100);
  updateProgress();
};


// ─── Progress ─────────────────────────────────────────────────────────────────
function updateProgress() {
  const total = QUESTIONS.length;
  const done = Object.keys(state.checked).length;
  const pts = Object.values(state.points).reduce((a,b) => a+b, 0);
  const score10 = total > 0 ? (pts / total * 10).toFixed(1) : 0;

  document.getElementById('score-badge').textContent = `${score10} / 10`;
  document.getElementById('done-lbl').textContent = `${done}/${total} câu`;
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-ring').style.background =
    `conic-gradient(var(--blue) ${pct}%, #1e2030 ${pct}%)`;
};

// ─── Submit ───────────────────────────────────────────────────────────────────
function submitAll() {
  submitted = true;
  document.getElementById('btn-submit').disabled = true;

  // Tự động kiểm tra các câu chưa làm
  QUESTIONS.forEach((q, i) => {
    if (!state.checked[i]) {
      state.points[i] = 0;
      state.checked[i] = true;
    }
  });
  updateProgress();

  const total = QUESTIONS.length;
  const pts = Object.values(state.points).reduce((a,b)=>a+b,0);
  const score10 = total > 0 ? pts / total * 10 : 0;
  const pct = Math.round(score10*10);

  const banner = document.getElementById('result-banner');
  banner.classList.add('show');
  const sc = document.getElementById('result-score');
  sc.textContent = score10.toFixed(1) + ' / 10';
  sc.className = `result-score ${score10 >= 8 ? 'high' : score10 >= 5 ? 'mid' : 'low'}`;
  document.getElementById('result-msg').textContent =
    score10 >= 9 ? '🏆 Xuất sắc! Bạn nắm rất vững kiến thức.' :
    score10 >= 7 ? '🎉 Tốt! Cần ôn thêm vài điểm nhỏ.' :
    score10 >= 5 ? '📚 Cần ôn tập thêm một số phần.' :
    '💪 Hãy xem lại lời giải và ôn tập kỹ hơn.';

  banner.scrollIntoView({behavior:'smooth'});
  lmsFinish(score10);
};

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  lmsInit();
  renderAll();
  updateProgress();
  // Re-render math after dynamic content
  if (window.renderMathInElement) {
    setTimeout(() => renderMathInElement(document.body, {
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError: false
    }), 200);
  }
});
</script>
