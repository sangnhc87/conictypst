<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Sinh Câu Hỏi Tương Tự — ConicTypst</title>
    <link rel="stylesheet" href="dashboard.css" />
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="global-nav.js" defer></script>
    <style>
        .tool-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        .tool-header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-header-left h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tool-header-left p {
            color: var(--muted);
            margin: 0;
            font-size: 0.93rem;
        }

        .tool-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .tool-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: 580px;
            box-shadow: var(--shadow-soft);
        }

        .panel-head {
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .panel-head-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .editor-area {
            flex: 1;
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            background: #fafafa;
            color: #1e293b;
        }

        .editor-area:focus {
            border-color: #0ea5e9;
            background: #fff;
        }

        /* Config Form */
        .config-bar {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: var(--shadow-soft);
        }

        .config-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .config-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text);
            white-space: nowrap;
        }

        .form-select, .form-input {
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 12px;
            font-size: 0.88rem;
            outline: none;
            background: #fff;
            color: var(--text);
            transition: border-color 0.2s;
        }

        .form-select:focus, .form-input:focus {
            border-color: #0ea5e9;
        }

        .form-input-key {
            width: 280px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
            font-size: 0.88rem;
        }

        .checkbox-container input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Button styles mimicking ngan-hang.html */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .btn-blue { background: #2563eb; color: #fff; }
        .btn-blue:hover { background: #1d4ed8; }
        .btn-green { background: #16a34a; color: #fff; }
        .btn-green:hover { background: #15803d; }
        .btn-sky { background: #0284c7; color: #fff; }
        .btn-sky:hover { background: #0369a1; }
        .btn-gray { background: #64748b; color: #fff; }
        .btn-gray:hover { background: #475569; }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.82rem;
        }

        .status-container {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .status-info {
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .status-error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header class="dash-topbar">
        <div class="dash-topbar-inner">
            <a class="dash-brand" href="dashboard.html">
                <span class="dash-brand-mark">C</span>
                <span>
                    <strong>ConicTypst</strong>
                    <small>Typst tool hub</small>
                </span>
            </a>
            <div></div>
            <nav class="dash-nav">
                <a href="dashboard.html"><i data-lucide="arrow-left" style="vertical-align: middle; width: 16px;"></i> Về Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="tool-page">
        <div class="tool-header">
            <div class="tool-header-left">
                <h1><i data-lucide="cpu" style="color: #7c3aed;"></i> AI Sinh Câu Hỏi Tương Tự</h1>
                <p>Sử dụng trí tuệ nhân tạo Gemini để sinh ra các câu hỏi toán mới có cấu trúc và mức độ khó tương tự từ một câu hỏi gốc.</p>
            </div>
            <button class="btn btn-gray btn-sm" onclick="showHelp()"><i data-lucide="help-circle"></i> Hướng dẫn</button>
        </div>

        <div class="tool-layout">
            <!-- Left panel: Source -->
            <div class="panel">
                <div class="panel-head">
                    <div class="panel-head-left">
                        <i data-lucide="file-code" style="color: #0ea5e9;"></i>
                        <span>Câu hỏi mẫu (Typst)</span>
                    </div>
                    <select class="form-select" id="sampleSelector" onchange="loadSample()" style="height: 30px; font-size: 0.8rem; padding: 0 8px;">
                        <option value="">Chọn mẫu nhanh...</option>
                        <option value="tn">Trắc nghiệm lựa chọn (#tn)</option>
                        <option value="ds">Trắc nghiệm Đúng/Sai (#ds)</option>
                        <option value="tln">Trắc nghiệm trả lời ngắn (#tln)</option>
                        <option value="tl">Tự luận (#tl)</option>
                    </select>
                </div>
                <div class="panel-body">
                    <textarea class="editor-area" id="sourceText" placeholder="Nhập hoặc dán câu hỏi mẫu dạng Typst ở đây (ví dụ: bắt đầu bằng //[ID] và khối lệnh #tn, #ds, #tln hoặc #tl)..."></textarea>
                </div>
            </div>

            <!-- Right panel: Result -->
            <div class="panel">
                <div class="panel-head">
                    <div class="panel-head-left">
                        <i data-lucide="check-square" style="color: #10b981;"></i>
                        <span>Kết quả sinh câu hỏi mới</span>
                    </div>
                    <button class="btn btn-green btn-sm" id="copyBtn" onclick="copyResult()" disabled><i data-lucide="copy"></i> Sao chép</button>
                </div>
                <div class="panel-body">
                    <textarea class="editor-area" id="resultText" readonly placeholder="Kết quả các câu hỏi mới được sinh ra sẽ hiển thị tại đây..."></textarea>
                </div>
            </div>
        </div>

        <!-- Configurations -->
        <div class="config-bar">
            <!-- API Key Input -->
            <div class="config-group">
                <span class="config-label"><i data-lucide="key" style="width: 16px; color: var(--muted);"></i> Gemini API Key:</span>
                <input type="password" class="form-input form-input-key" id="apiKey" placeholder="Dán Gemini API Key của bạn từ Google AI Studio..." />
                <button class="btn btn-gray btn-sm" onclick="saveApiKey()">Lưu Key</button>
            </div>

            <div class="config-group">
                <span class="config-label">Model:</span>
                <select class="form-select" id="modelSelect">
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash (Khuyên dùng)</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash (Nhanh)</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (Thông minh)</option>
                </select>
            </div>

            <div class="config-group">
                <span class="config-label">Số lượng câu sinh:</span>
                <input type="number" class="form-input" id="numQuestions" value="3" min="1" max="10" style="width: 70px; text-align: center;" />
            </div>

            <div class="config-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="includeSolutions" checked />
                    Kèm lời giải (loigiai)
                </label>
            </div>

            <button class="btn btn-blue" id="generateBtn" onclick="generateSimilar()"><i data-lucide="sparkles"></i> Bắt đầu tạo</button>
        </div>

        <!-- Status Container -->
        <div class="status-container" id="statusBox">
            <i data-lucide="loader" class="spin" id="statusIcon"></i>
            <span id="statusMessage">Đang xử lý...</span>
        </div>
    </main>

    <script>
        const sampleExercises = {
            tn: `//[0D1N1-1]
#tn[
  Mệnh đề nào sau đây đúng?
][
  $1 + 1 = 3$
][
  #True[Trái Đất quay quanh Mặt Trời.]
][
  Mặt Trời quay quanh Trái Đất.
][
  $2 > 3$
][
  loigiai: [
    Trái Đất quay quanh Mặt Trời là một mệnh đề đúng khoa học.
  ]
]`,
            ds: `//[0D1H2-1]
#ds[
  Cho tập hợp $A = {1, 2, 3}$. Xét tính đúng sai của các khẳng định sau:
][
  #True[$1 in A$]
][
  $4 in A$
][
  #True[$A$ có 8 tập con.]
][
  \${1, 2\} in A$
][
  loigiai: [
    - $1 in A$ đúng.
    - $4 in A$ sai.
    - Số tập con của $A$ là $2^3 = 8$ đúng.
    - \${1, 2\} subset A$ chứ không phải $in A$ nên khẳng định 4 sai.
  ]
]`,
            tln: `//[0D1V3-1]
#tln[
  Tìm số phần tử của tập hợp $A = {x in ZZ | x^2 - 4 = 0}$.
][
  2
][
  loigiai: [
    Ta có $x^2 - 4 = 0 <=> x = +-2$. Cả hai đều thuộc $ZZ$ nên $A = {-2, 2}$. Số phần tử của $A$ là 2.
  ]
]`,
            tl: `//[0D1C2-2]
#tl[
  Chứng minh rằng với mọi số tự nhiên $n$, ta có $A = n^3 - n$ chia hết cho 6.
][
  loigiai: [
    Ta có $A = n(n^2 - 1) = (n - 1)n(n + 1)$.
    Vì $n - 1, n, n + 1$ là ba số nguyên liên tiếp nên:
    - Ít nhất một số chia hết cho 2 $=> A$ chia hết cho 2.
    - Một số chia hết cho 3 $=> A$ chia hết cho 3.
    Vì \\gcd(2,3) = 1 nên $A$ chia hết cho $2 \\cdot 3 = 6$. Ta có đpcm.
  ]
]`
        };

        window.addEventListener('DOMContentLoaded', () => {
            // Load saved key
            const savedKey = localStorage.getItem('conictypst_gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
            window.lucide?.createIcons();
        });

        function loadSample() {
            const val = document.getElementById('sampleSelector').value;
            if (val && sampleExercises[val]) {
                document.getElementById('sourceText').value = sampleExercises[val];
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('conictypst_gemini_api_key', key);
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Đã lưu API Key!',
                    showConfirmButton: false,
                    timer: 1500
                });
            } else {
                localStorage.removeItem('conictypst_gemini_api_key');
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'info',
                    title: 'Đã xóa API Key',
                    showConfirmButton: false,
                    timer: 1500
                });
            }
        }

        function showHelp() {
            Swal.fire({
                title: 'Hướng dẫn sử dụng AI Sinh Câu Hỏi',
                icon: 'info',
                html: `
                    <div style="text-align: left; font-size: 0.92rem; line-height: 1.6;">
                        <p>1. <strong>Tạo API Key</strong> miễn phí tại <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:#0284c7; font-weight:600;">Google AI Studio</a>.</p>
                        <p>2. Dán API Key vào ô cấu hình bên dưới và nhấn <strong>Lưu Key</strong> để không phải nhập lại lần sau.</p>
                        <p>3. Dán một câu hỏi mẫu dạng Typst vào ô bên trái (hoặc chọn nhanh mẫu từ danh sách).</p>
                        <p>4. Cấu hình số lượng câu cần tạo và nhấn <strong>Bắt đầu tạo</strong> để AI tự động sinh câu tương tự!</p>
                    </div>
                `,
                confirmButtonText: 'Đã hiểu'
            });
        }

        function setStatus(type, msg) {
            const box = document.getElementById('statusBox');
            const txt = document.getElementById('statusMessage');
            const icon = document.getElementById('statusIcon');
            
            if (!type) {
                box.style.display = 'none';
                return;
            }
            
            box.style.display = 'flex';
            txt.textContent = msg;
            
            if (type === 'loading') {
                box.className = 'status-container status-info';
                icon.style.display = 'inline-block';
                icon.setAttribute('data-lucide', 'loader');
            } else if (type === 'error') {
                box.className = 'status-container status-error';
                icon.style.display = 'inline-block';
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            window.lucide?.createIcons();
        }

        async function generateSimilar() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const source = document.getElementById('sourceText').value.trim();
            const model = document.getElementById('modelSelect').value;
            const count = parseInt(document.getElementById('numQuestions').value) || 3;
            const withSol = document.getElementById('includeSolutions').checked;

            if (!apiKey) {
                Swal.fire('Lỗi cấu hình', 'Vui lòng cung cấp Gemini API Key.', 'warning');
                return;
            }
            if (!source) {
                Swal.fire('Lỗi dữ liệu', 'Vui lòng nhập câu hỏi mẫu.', 'warning');
                return;
            }

            const generateBtn = document.getElementById('generateBtn');
            const copyBtn = document.getElementById('copyBtn');
            
            generateBtn.disabled = true;
            copyBtn.disabled = true;
            document.getElementById('resultText').value = '';
            
            setStatus('loading', `Đang sinh ${count} câu hỏi tương tự bằng ${model}...`);

            const prompt = `Dưới đây là một câu hỏi toán học định dạng Typst (có thể bao gồm ID định dạng //[ID] ở dòng phía trước câu hỏi).
Hãy tạo ra chính xác ${count} câu hỏi toán học tương tự có cấu trúc, dạng toán và độ khó tương đương, nhưng thay đổi dữ liệu, số liệu và câu chữ để thành các bài toán mới hoàn toàn.

Quy tắc bắt buộc:
1. Định dạng kết quả phải là mã nguồn Typst chuẩn xác giống câu mẫu.
2. Không thêm bất kỳ văn bản giải thích, giới thiệu nào ngoài mã nguồn Typst.
3. Không đặt mã nguồn trong các khối markdown \`\`\`typst hay \`\`\`. Chỉ trả về nội dung mã nguồn Typst thuần túy.
4. Với mỗi câu sinh ra, hãy tự động gắn dòng định danh ID tương ứng (hoặc giữ nguyên cấu trúc ID của câu mẫu, ví dụ: //[0D1N1-1]) ngay phía trên khối lệnh câu hỏi đó.
5. ${withSol ? 'Mỗi câu hỏi sinh ra PHẢI kèm khối giải chi tiết loigiai: [...] hoặc tương tự giống câu mẫu.' : 'Không kèm lời giải loigiai.'}

Câu hỏi mẫu:
${source}`;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error?.message || 'Lỗi không xác định từ API');
                }

                const data = await res.json();
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                
                // Strip markdown blocks if AI returned them
                text = text.replace(/^```typst\n/i, '').replace(/^```typ\n/i, '').replace(/^```\n/, '').replace(/\n```$/, '');
                
                document.getElementById('resultText').value = text;
                copyBtn.disabled = false;
                setStatus(null);
                
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Đã sinh câu hỏi thành công!',
                    showConfirmButton: false,
                    timer: 2000
                });
            } catch (err) {
                setStatus('error', 'Lỗi sinh câu hỏi: ' + err.message);
            } finally {
                generateBtn.disabled = false;
            }
        }

        function copyResult() {
            const res = document.getElementById('resultText');
            res.select();
            document.execCommand('copy');
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: 'Đã copy vào bộ nhớ tạm!',
                showConfirmButton: false,
                timer: 1500
            });
        }
    </script>
</body>
</html>
