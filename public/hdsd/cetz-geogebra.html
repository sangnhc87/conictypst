<!DOCTYPE html>
<html lang="vi">
<head>

  <script src="copyright-guard.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoGebra ➝ CeTZ Live — ConicTypst</title>
  <link rel="stylesheet" href="dashboard.css" />
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="global-nav.js" defer></script>
  <script type="module" src="playground.js"></script>
  <!-- GeoGebra API Primary Loader -->
  <script src="https://cdn.geogebra.org/apps/deployggb.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .generator-layout {
      display: flex;
      flex: 1;
      gap: 20px;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      height: calc(100vh - 60px);
    }

    .panel-left {
      flex: 1;
      background: #ffffff; /* GGB usually needs white bg */
      border: 1px solid #334155;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 600px;
    }

    .panel-right {
      width: 450px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .panel-title {
      padding: 16px;
      font-weight: 600;
      font-size: 1rem;
      color: #f8fafc;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-success {
      background: #10b981;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-success:hover { background: #059669; }
    .btn-primary:hover { background: #0ea5e9; }

    #codeOutput {
      width: 100%;
      flex: 1;
      background: #0f172a;
      border: none;
      color: #38bdf8;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.9rem;
      padding: 16px;
      resize: none;
      box-sizing: border-box;
      white-space: pre;
      overflow-x: auto;
    }

    #codeOutput:focus {
      outline: none;
    }

    #ggb-element {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .ggb-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      padding: 24px;
      color: #475569;
      background: #ffffff;
      text-align: center;
      font-size: 0.9rem;
      z-index: 2;
    }
  </style>

  <!-- 1-Click Templates -->
</head>
<body>
  <!-- Header inject from global-nav.js -->

  <div class="generator-layout">
    <!-- LEFT PANEL: GEOGEBRA -->
    <div class="panel-left">
      <div id="ggb-element">
        <div class="ggb-status" id="ggbStatus">Đang tải GeoGebra...</div>
      </div>
    </div>

    <!-- RIGHT PANEL: CODE OUTPUT -->
    <div class="panel-right">
      <div class="panel-title">
        <i data-lucide="code" style="width: 18px; height: 18px;"></i> Code
        <div style="margin-left: auto; display: flex; gap: 8px;">
          <button class="btn-primary" onclick="copyCode()">
            <i data-lucide="copy" style="width: 14px; height: 14px;"></i> Copy Code
          </button>
          <button class="btn-success" id="btnTriggerCompile">
            <i data-lucide="play" style="width: 14px; height: 14px;"></i> Refresh Preview
          </button>
        </div>
      </div>
      <textarea id="codeOutput" spellcheck="false"></textarea>
      
      <!-- Preview Container -->
      <div id="compiledSvgContainer" style="width: 100%; height: 350px; background: white; border-top: 1px solid #334155; overflow: auto; display: flex; align-items: center; justify-content: center;">
        <span style="color: #64748b; font-size: 0.85rem;">(Bản xem trước SVG sẽ tự động xuất hiện ở đây)</span>
      </div>
      <div id="compileOverlay" style="display: none; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.7); align-items: center; justify-content: center; flex-direction: column; z-index: 100;">
        <i data-lucide="loader-circle" style="width: 32px; height: 32px; color: #38bdf8; animation: spin 1s linear infinite;"></i>
        <div style="color: white; margin-top: 10px; font-size: 0.9rem;">Đang biên dịch Typst...</div>
      </div>
    </div>
  </div>

  <script>
    let debounceTimer;
    let retryCount = 0;

    function setGgbStatus(message, isError = false) {
      const status = document.getElementById("ggbStatus");
      if (!status) return;
      status.style.display = "flex";
      status.style.color = isError ? "#b91c1c" : "#475569";
      status.innerHTML = isError
        ? `<strong>GeoGebra chưa sẵn sàng.</strong><span>${message}</span><button class="btn-primary" type="button" onclick="retryGeoGebra()">Thử lại</button>`
        : `<span>${message}</span>`;
    }

    function hideGgbStatus() {
      const status = document.getElementById("ggbStatus");
      if (status) status.style.display = "none";
    }

    function getPanelSize() {
      const panel = document.querySelector('.panel-left');
      const rect = panel?.getBoundingClientRect();
      return {
        width: Math.max(640, Math.round(rect?.width || panel?.clientWidth || 900)),
        height: Math.max(520, Math.round(rect?.height || panel?.clientHeight || 650)),
      };
    }

    let ggbLoadPromise = null;
    const GGB_SCRIPT_URLS = [
      "https://www.geogebra.org/apps/deployggb.js",
      "https://cdn.geogebra.org/apps/deployggb.js",
    ];

    function loadGeoGebraScript() {
      if (typeof GGBApplet !== "undefined") return Promise.resolve();
      if (ggbLoadPromise) return ggbLoadPromise;
      ggbLoadPromise = new Promise((resolve, reject) => {
        let index = 0;
        const tryNext = () => {
          if (typeof GGBApplet !== "undefined") return resolve();
          if (index >= GGB_SCRIPT_URLS.length) {
            reject(new Error("Máy/chặn mạng không vào được geogebra.org hoặc cdn.geogebra.org."));
            return;
          }
          const src = GGB_SCRIPT_URLS[index++];
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.onload = () => {
            if (typeof GGBApplet !== "undefined") resolve();
            else tryNext();
          };
          script.onerror = tryNext;
          document.head.appendChild(script);
        };
        tryNext();
      });
      return ggbLoadPromise;
    }

    async function initGeoGebra() {
      setGgbStatus("Đang tải GeoGebra...");
      try {
        await loadGeoGebraScript();
      } catch (err) {
        setGgbStatus(`${err.message} Nếu mạng đang chặn GeoGebra, hãy tải lại trang hoặc đổi mạng.`, true);
        return;
      }

      const size = getPanelSize();
      const host = document.getElementById("ggb-element");
      host.innerHTML = '<div class="ggb-status" id="ggbStatus">Đang mở bảng vẽ GeoGebra...</div>';
      var params = {
        "appName": "geometry",
        "width": size.width,
        "height": size.height,
        "showToolBar": true,
        "showAlgebraInput": true,
        "showMenuBar": true,
        "enableRightClick": true,
        "enableLabelDrags": false,
        "showResetIcon": true,
        "language": "vi",
        "useBrowserForJS": true,
        "appletOnLoad": function(api) {
          window.ggbApplet = api;
          hideGgbStatus();
          api.registerUpdateListener("ggbUpdateListener");
          api.registerAddListener("ggbUpdateListener");
          api.registerRemoveListener("ggbUpdateListener");
          api.registerRenameListener("ggbUpdateListener");
          api.registerClearListener("ggbUpdateListener");
          if (typeof api.registerUpdateStyleListener === "function") {
             api.registerUpdateStyleListener("ggbUpdateListener");
          }
          
          // Fallback polling for style changes
          setInterval(function() {
            if (!window.ggbApplet) return;
            let currentXml = window.ggbApplet.getXML();
            if (window.lastGgbXml !== currentXml) {
               window.lastGgbXml = currentXml;
               window.ggbUpdateListener("poll");
            }
          }, 1000);
          
          // Initial generation
          setTimeout(generateCetz, 500);
        }
      };
      var applet = new GGBApplet(params, true);
      applet.inject('ggb-element');
    }

    function retryGeoGebra() {
      retryCount = 0;
      ggbLoadPromise = null;
      initGeoGebra();
    }

    // This must be globally accessible for GeoGebra applet
    window.ggbUpdateListener = function(objName) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(generateCetz, 200);
    };

    function generateCetz() {
      if (!window.ggbApplet) return;
      
      const xmlString = ggbApplet.getXML();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, "text/xml");
      
      let elements = xmlDoc.getElementsByTagName("element");
      let commands = xmlDoc.getElementsByTagName("command");
      const fmt = (n, digits = 2) => {
        if (!Number.isFinite(n)) return "0";
        const rounded = Math.round(n * Math.pow(10, digits)) / Math.pow(10, digits);
        return Object.is(rounded, -0) ? "0" : String(rounded);
      };
      const colorExpr = (r, g, b) => `rgb(${r}, ${g}, ${b})`;
      const fillExpr = (r, g, b, alpha) => `${colorExpr(r, g, b)}.transparentize(${fmt(100 - alpha, 0)}%)`;
      const numericInput = (value, fallback = NaN) => {
        const direct = Number(value);
        if (Number.isFinite(direct)) return direct;
        try {
          const evaluated = Number(window.ggbApplet?.getValue?.(value));
          return Number.isFinite(evaluated) ? evaluated : fallback;
        } catch (_) {
          return fallback;
        }
      };
      const conicFromMatrix = element => {
        const matrix = element.getElementsByTagName("matrix")[0];
        if (!matrix) return null;
        const a = numericInput(matrix.getAttribute("A0"));
        const c = numericInput(matrix.getAttribute("A1"));
        const f = numericInput(matrix.getAttribute("A2"));
        const b = numericInput(matrix.getAttribute("A3"));
        const d = numericInput(matrix.getAttribute("A4"));
        const e = numericInput(matrix.getAttribute("A5"));
        if (![a, b, c, d, e, f].every(Number.isFinite)) return null;
        const determinant = a * c - b * b;
        if (Math.abs(determinant) < 1e-9) return { kind: "parabola", a, b, c, d, e, f };
        const cx = (b * e - c * d) / determinant;
        const cy = (b * d - a * e) / determinant;
        const constant = f + d * cx + e * cy;
        const trace = a + c;
        const delta = Math.sqrt(Math.max(0, (a - c) ** 2 + 4 * b ** 2));
        const eigen1 = (trace + delta) / 2;
        const eigen2 = (trace - delta) / 2;
        const rotation = .5 * Math.atan2(2 * b, a - c);
        const radius1Sq = -constant / eigen1;
        const radius2Sq = -constant / eigen2;
        if (radius1Sq > 1e-9 && radius2Sq > 1e-9) {
          return { kind: "ellipse", cx, cy, r1: Math.sqrt(radius1Sq), r2: Math.sqrt(radius2Sq), rotation };
        }
        if (radius1Sq * radius2Sq < -1e-9) {
          const first = radius1Sq > 0;
          return {
            kind: "hyperbola", cx, cy,
            major: Math.sqrt(Math.abs(first ? radius1Sq : radius2Sq)),
            minor: Math.sqrt(Math.abs(first ? radius2Sq : radius1Sq)),
            rotation: rotation + (first ? 0 : Math.PI / 2),
          };
        }
        return null;
      };
      
      let code = `#import "@preview/cetz:0.5.2": *
#import draw: *

#align(center)[
  #canvas({
    set-style(
      mark: (fill: black, scale: 0.6),
      stroke: (thickness: 1.2pt)
    )

`;

      let points = {};
      let commandOutputs = {}; // Maps output label -> { name: commandName, inputs: [...] }
      
      // Pass 1: Build command output map
      for (let i = 0; i < commands.length; i++) {
        let cmd = commands[i];
        let name = cmd.getAttribute("name");
        let inputs = [];
        let inNode = cmd.getElementsByTagName("input")[0];
        if (inNode) {
          for (let j=0; j<10; j++) {
            let a = inNode.getAttribute("a"+j);
            if (a) inputs.push(a);
          }
        }
        let outNode = cmd.getElementsByTagName("output")[0];
        if (outNode) {
          let outputs = [];
          for (let j=0; j<20; j++) {
            let a = outNode.getAttribute("a"+j);
            if (a) outputs.push(a);
          }
          for (let j=0; j<outputs.length; j++) {
            commandOutputs[outputs[j]] = { name, inputs, outIndex: j, outputs };
          }
        }
      }

      // Pass 2: Extract points (needed for distance/angle calculations)
      for (let i = 0; i < elements.length; i++) {
        let el = elements[i];
        if (el.getAttribute("type") === "point") {
          let label = el.getAttribute("label");
          let coords = el.getElementsByTagName("coords")[0];
          if (coords) {
            let x = parseFloat(coords.getAttribute("x"));
            let y = parseFloat(coords.getAttribute("y"));
            let z = parseFloat(coords.getAttribute("z"));
            x = Math.round((x / z) * 100) / 100;
            y = Math.round((y / z) * 100) / 100;
            points[label] = {x, y};
          }
        }
      }

      // Pass 3: Process all visible elements for drawing
      let getCoord = (lbl) => points[lbl] ? `(${fmt(points[lbl].x)}, ${fmt(points[lbl].y)})` : `"${lbl}"`;
      const regularPolygonCoords = (firstLabel, secondLabel, countValue) => {
        const first = points[firstLabel];
        const second = points[secondLabel];
        const count = Math.round(numericInput(countValue));
        if (!first || !second || count < 3 || count > 100) return [];
        const vertices = [first, second];
        const step = 2 * Math.PI / count;
        for (let vertexIndex = 2; vertexIndex < count; vertexIndex++) {
          const previous = vertices[vertexIndex - 1];
          const prior = vertices[vertexIndex - 2];
          const dx = previous.x - prior.x;
          const dy = previous.y - prior.y;
          vertices.push({
            x: previous.x + dx * Math.cos(step) - dy * Math.sin(step),
            y: previous.y + dx * Math.sin(step) + dy * Math.cos(step),
          });
        }
        return vertices.map(point => `(${fmt(point.x)}, ${fmt(point.y)})`);
      };

      for (let i = 0; i < elements.length; i++) {
        let el = elements[i];
        let label = el.getAttribute("label");
        let type = el.getAttribute("type");
        let showObj = el.getElementsByTagName("show")[0]?.getAttribute("object") === "true";
        let showLabel = el.getElementsByTagName("show")[0]?.getAttribute("label") === "true";
        if (!showObj) continue;

        // Extract styles
        let objColor = el.getElementsByTagName("objColor")[0];
        let lineStyle = el.getElementsByTagName("lineStyle")[0];
        let labelOffset = el.getElementsByTagName("labelOffset")[0];
        let pointSize = el.getElementsByTagName("pointSize")[0]?.getAttribute("val") || "5";

        let r = "0", g = "0", b = "0", alpha = "10";
        if (objColor) {
           r = objColor.getAttribute("r");
           g = objColor.getAttribute("g");
           b = objColor.getAttribute("b");
           alpha = Math.round(parseFloat(objColor.getAttribute("alpha") || "0.1") * 100);
        }
        let isDefaultBlack = (r === "0" && g === "0" && b === "0");
        let rgbStr = colorExpr(r, g, b);
        
        let strokeParts = [];
        if (!isDefaultBlack && type !== "point") {
           strokeParts.push(`paint: ${rgbStr}`);
        }
        if (lineStyle) {
           let th = lineStyle.getAttribute("thickness");
           if (th && th !== "5") strokeParts.push(`thickness: ${Math.round(parseInt(th) * 0.2 * 10)/10}pt`);
           let ltype = lineStyle.getAttribute("type");
           if (ltype === "10" || ltype === "15") strokeParts.push(`dash: "dashed"`);
           else if (ltype === "20") strokeParts.push(`dash: "dotted"`);
           else if (ltype === "25" || ltype === "30") strokeParts.push(`dash: "dash-dotted"`);
           else if (ltype && ltype !== "0") strokeParts.push(`dash: "dashed"`);
         }
        let strokeStr = strokeParts.length > 0 ? `, stroke: (${strokeParts.join(", ")})` : "";
        let polyFillStr = `, fill: ${fillExpr(r, g, b, alpha)}`;

        let cmdInfo = commandOutputs[label];

        if (cmdInfo && /^Integral(Between)?$/i.test(cmdInfo.name)) {
          const between = /Between/i.test(cmdInfo.name);
          const firstFunction = cmdInfo.inputs[0];
          const secondFunction = between ? cmdInfo.inputs[1] : null;
          const lower = numericInput(cmdInfo.inputs[between ? 2 : 1]);
          const upper = numericInput(cmdInfo.inputs[between ? 3 : 2]);
          const sample = functionLabel => {
            const values = [];
            for (let sampleIndex = 0; sampleIndex <= 90; sampleIndex++) {
              const x = lower + (upper - lower) * sampleIndex / 90;
              const y = numericInput(window.ggbApplet?.getValue?.(`${functionLabel}(${x})`));
              if (!Number.isFinite(y)) return [];
              values.push(`(${fmt(x)}, ${fmt(y)})`);
            }
            return values;
          };
          if (Number.isFinite(lower) && Number.isFinite(upper) && upper > lower) {
            const top = sample(firstFunction);
            const bottom = secondFunction
              ? sample(secondFunction).reverse()
              : [`(${fmt(upper)}, 0)`, `(${fmt(lower)}, 0)`];
            if (top.length > 1 && bottom.length > 1) {
              code += `    line(\n      ${[...top, ...bottom].join(",\n      ")},\n      close: true, stroke: none${polyFillStr}\n    )\n`;
            } else {
              code += `    // Integral skipped: discontinuity inside [${fmt(lower)}, ${fmt(upper)}]\n`;
            }
          }
          continue;
        }

        if (type === "point") {
          let p = points[label];
          if (!p) continue;
          let rad = Math.round(parseInt(pointSize) * 0.012 * 100) / 100;
          code += `    circle((${fmt(p.x)}, ${fmt(p.y)}), radius: ${fmt(rad)}, fill: ${rgbStr}, name: "${label}")\n`;
          if (showLabel) {
            let dx = 0.2, dy = -0.2;
            if (labelOffset) {
               dx = Math.round(parseFloat(labelOffset.getAttribute("x")) / 25 * 10) / 10;
               dy = Math.round(-parseFloat(labelOffset.getAttribute("y")) / 25 * 10) / 10;
            }
            code += `    content((rel: (${fmt(dx)}, ${fmt(dy)}), to: "${label}"), [$${label}$])\n`;
          }
        } 
        else if (type === "segment") {
          if (cmdInfo && cmdInfo.name === "Segment") {
            let codeSeg = `    line(${getCoord(cmdInfo.inputs[0])}, ${getCoord(cmdInfo.inputs[1])}${strokeStr})\n`;
            let dec = el.getElementsByTagName("decoration")[0];
            if (dec) {
               let dType = parseInt(dec.getAttribute("type") || "0");
               let p1 = points[cmdInfo.inputs[0]];
               let p2 = points[cmdInfo.inputs[1]];
               if (p1 && p2) {
                  let mx = (p1.x + p2.x) / 2;
                  let my = (p1.y + p2.y) / 2;
                  let dx = p2.x - p1.x;
                  let dy = p2.y - p1.y;
                  let len = Math.hypot(dx, dy);
                  if (len > 0) {
                     let nx = -dy / len;
                     let ny = dx / len;
                     let tickLen = 0.2;
                     let gap = 0.12;
                     if (dType === 0) {
                        codeSeg += `    line((${fmt(mx - nx*tickLen)}, ${fmt(my - ny*tickLen)}), (${fmt(mx + nx*tickLen)}, ${fmt(my + ny*tickLen)}), stroke: 1pt)\n`;
                     } else if (dType === 1) {
                        let m1x = mx - (dx/len)*gap/2; let m1y = my - (dy/len)*gap/2;
                        let m2x = mx + (dx/len)*gap/2; let m2y = my + (dy/len)*gap/2;
                        codeSeg += `    line((${fmt(m1x - nx*tickLen)}, ${fmt(m1y - ny*tickLen)}), (${fmt(m1x + nx*tickLen)}, ${fmt(m1y + ny*tickLen)}), stroke: 1pt)\n`;
                        codeSeg += `    line((${fmt(m2x - nx*tickLen)}, ${fmt(m2y - ny*tickLen)}), (${fmt(m2x + nx*tickLen)}, ${fmt(m2y + ny*tickLen)}), stroke: 1pt)\n`;
                     } else if (dType === 2) {
                        let m1x = mx - (dx/len)*gap; let m1y = my - (dy/len)*gap;
                        let m2x = mx + (dx/len)*gap; let m2y = my + (dy/len)*gap;
                        codeSeg += `    line((${fmt(m1x - nx*tickLen)}, ${fmt(m1y - ny*tickLen)}), (${fmt(m1x + nx*tickLen)}, ${fmt(m1y + ny*tickLen)}), stroke: 1pt)\n`;
                        codeSeg += `    line((${fmt(mx - nx*tickLen)}, ${fmt(my - ny*tickLen)}), (${fmt(mx + nx*tickLen)}, ${fmt(my + ny*tickLen)}), stroke: 1pt)\n`;
                        codeSeg += `    line((${fmt(m2x - nx*tickLen)}, ${fmt(m2y - ny*tickLen)}), (${fmt(m2x + nx*tickLen)}, ${fmt(m2y + ny*tickLen)}), stroke: 1pt)\n`;
                     }
                  }
               }
            }
            code += codeSeg;
          } else if (cmdInfo && cmdInfo.name === "Polygon") {
             let polyPts = [];
             let isRegular = cmdInfo.inputs.length === 3 && !isNaN(parseInt(cmdInfo.inputs[2]));
             if (isRegular) {
                polyPts = [cmdInfo.inputs[0], cmdInfo.inputs[1]];
                for (let j = 0; j < cmdInfo.outputs.length; j++) {
                   let outLabel = cmdInfo.outputs[j];
                   if (points[outLabel]) polyPts.push(outLabel);
                }
             } else {
                polyPts = [...cmdInfo.inputs];
             }
             let edges = [];
             for (let j = 1; j < cmdInfo.outputs.length; j++) {
                let outLabel = cmdInfo.outputs[j];
                if (!points[outLabel]) edges.push(outLabel);
             }
             let edgeIdx = edges.indexOf(label);
             if (edgeIdx !== -1) {
                let p1Name = polyPts[edgeIdx];
                let p2Name = polyPts[(edgeIdx + 1) % polyPts.length];
                code += `    line(${getCoord(p1Name)}, ${getCoord(p2Name)}${strokeStr})\n`;
             }
          }
        } 
        else if (type === "vector") {
          if (cmdInfo && cmdInfo.name === "Vector") {
             let strokeV = strokeStr;
             if (strokeV === "") strokeV = ", stroke: (paint: black)";
             const start = cmdInfo.inputs.length > 1 ? getCoord(cmdInfo.inputs[0]) : "(0, 0)";
             const end = getCoord(cmdInfo.inputs[cmdInfo.inputs.length - 1]);
             code += `    line(${start}, ${end}, mark: (end: ">", fill: ${rgbStr})${strokeV})\n`;
          }
        }
        else if (type === "line") {
          if (cmdInfo && cmdInfo.name === "Line") {
             let p1 = points[cmdInfo.inputs[0]];
             let p2 = points[cmdInfo.inputs[1]];
             if (p1 && p2) {
                let dx = p2.x - p1.x; let dy = p2.y - p1.y;
                let ext1x = p1.x - dx * 10; let ext1y = p1.y - dy * 10;
                let ext2x = p2.x + dx * 10; let ext2y = p2.y + dy * 10;
                code += `    line((${fmt(ext1x)}, ${fmt(ext1y)}), (${fmt(ext2x)}, ${fmt(ext2y)})${strokeStr})\n`;
             }
          }
        }
        else if (type === "ray") {
          if (cmdInfo && cmdInfo.name === "Ray") {
             let p1 = points[cmdInfo.inputs[0]];
             let p2 = points[cmdInfo.inputs[1]];
             if (p1 && p2) {
                let dx = p2.x - p1.x; let dy = p2.y - p1.y;
                let ext2x = p2.x + dx * 10; let ext2y = p2.y + dy * 10;
                code += `    line((${fmt(p1.x)}, ${fmt(p1.y)}), (${fmt(ext2x)}, ${fmt(ext2y)})${strokeStr})\n`;
             }
          }
        }
        else if (type === "polyline") {
          if (cmdInfo && (cmdInfo.name === "PolyLine" || cmdInfo.name === "Polygonal")) {
             let polyPts = [...cmdInfo.inputs];
             let coordsList = polyPts.filter(p => points[p]).map(p => getCoord(p));
             if (coordsList.length >= 2) {
                 code += `    line(${coordsList.join(', ')}${strokeStr})\n`;
             }
          }
        }
        else if (type === "polygon") {
          if (cmdInfo && cmdInfo.name === "Polygon") {
            let polyPts = [];
            let isRegular = cmdInfo.inputs.length === 3 && !isNaN(parseInt(cmdInfo.inputs[2]));
            if (isRegular) {
               polyPts = [cmdInfo.inputs[0], cmdInfo.inputs[1]];
               for (let j = 0; j < cmdInfo.outputs.length; j++) {
                  let outLabel = cmdInfo.outputs[j];
                  if (points[outLabel]) polyPts.push(outLabel);
               }
            } else {
               polyPts = [...cmdInfo.inputs];
            }
            let coordsList = isRegular
              ? regularPolygonCoords(cmdInfo.inputs[0], cmdInfo.inputs[1], cmdInfo.inputs[2])
              : polyPts.map(p => getCoord(p));
            if (coordsList.length >= 3) {
              code += `    line(${coordsList.join(', ')}, close: true, stroke: none${polyFillStr})\n`;
            }
          }
        } 
        else if (type === "conic" || type === "conicpart" || type === "arc" || type === "sector" || type === "semicircle") {
          if (cmdInfo && cmdInfo.name === "Circle") {
            let pCenter = points[cmdInfo.inputs[0]];
            let pOnCircle = points[cmdInfo.inputs[1]];
            if (pCenter) {
              if (pOnCircle) {
                let rad = Math.hypot(pOnCircle.x - pCenter.x, pOnCircle.y - pCenter.y);
                code += `    circle(${getCoord(cmdInfo.inputs[0])}, radius: ${fmt(rad)}${strokeStr}${polyFillStr})\n`;
              } else {
                let rad = numericInput(cmdInfo.inputs[1]);
                if (Number.isFinite(rad)) {
                   code += `    circle(${getCoord(cmdInfo.inputs[0])}, radius: ${fmt(rad)}${strokeStr}${polyFillStr})\n`;
                }
              }
            }
          } else if (cmdInfo && (cmdInfo.name === "CircularArc" || cmdInfo.name === "CircleArc")) {
            let pCenter = points[cmdInfo.inputs[0]];
            let pStart = points[cmdInfo.inputs[1]];
            let pStop = points[cmdInfo.inputs[2]];
            if (pCenter && pStart && pStop) {
              let rad = Math.hypot(pStart.x - pCenter.x, pStart.y - pCenter.y);
              let startAngle = Math.atan2(pStart.y - pCenter.y, pStart.x - pCenter.x) * 180 / Math.PI;
              let stopAngle = Math.atan2(pStop.y - pCenter.y, pStop.x - pCenter.x) * 180 / Math.PI;
              if (stopAngle < startAngle) stopAngle += 360;
              code += `    arc(${getCoord(cmdInfo.inputs[1])}, start: ${fmt(startAngle, 1)}deg, stop: ${fmt(stopAngle, 1)}deg, radius: ${fmt(rad)}${strokeStr})\n`;
            }
          } else if (cmdInfo && (cmdInfo.name === "CircularSector" || cmdInfo.name === "CircleSector" || cmdInfo.name === "Sector")) {
            let pCenter = points[cmdInfo.inputs[0]];
            let pStart = points[cmdInfo.inputs[1]];
            let pStop = points[cmdInfo.inputs[2]];
            if (pCenter && pStart && pStop) {
              let rad = Math.hypot(pStart.x - pCenter.x, pStart.y - pCenter.y);
              let startAngle = Math.atan2(pStart.y - pCenter.y, pStart.x - pCenter.x) * 180 / Math.PI;
              let stopAngle = Math.atan2(pStop.y - pCenter.y, pStop.x - pCenter.x) * 180 / Math.PI;
              if (stopAngle < startAngle) stopAngle += 360;
              code += `    arc(${getCoord(cmdInfo.inputs[1])}, start: ${fmt(startAngle, 1)}deg, stop: ${fmt(stopAngle, 1)}deg, radius: ${fmt(rad)}, mode: "PIE"${strokeStr}${polyFillStr})\n`;
            }
          } else if (cmdInfo && cmdInfo.name === "Semicircle") {
            let p1 = points[cmdInfo.inputs[0]];
            let p2 = points[cmdInfo.inputs[1]];
            if (p1 && p2) {
              let cx = (p1.x + p2.x) / 2;
              let cy = (p1.y + p2.y) / 2;
              let rad = Math.hypot(p1.x - p2.x, p1.y - p2.y) / 2;
              let startAngle = Math.atan2(p2.y - cy, p2.x - cx) * 180 / Math.PI;
              let stopAngle = startAngle + 180;
              code += `    arc(${getCoord(cmdInfo.inputs[1])}, start: ${fmt(startAngle, 1)}deg, stop: ${fmt(stopAngle, 1)}deg, radius: ${fmt(rad)}, mode: "CLOSE"${strokeStr}${polyFillStr})\n`;
            }
          } else if (cmdInfo && (cmdInfo.name === "CircumcircularArc" || cmdInfo.name === "CircumcircleArc")) {
            code += `    arc-through(${getCoord(cmdInfo.inputs[0])}, ${getCoord(cmdInfo.inputs[1])}, ${getCoord(cmdInfo.inputs[2])}${strokeStr})\n`;
          } else {
            const conic = conicFromMatrix(el);
            if (conic?.kind === "ellipse") {
              const coords = [];
              for (let sampleIndex = 0; sampleIndex < 96; sampleIndex++) {
                const t = 2 * Math.PI * sampleIndex / 96;
                const localX = conic.r1 * Math.cos(t);
                const localY = conic.r2 * Math.sin(t);
                const x = conic.cx + localX * Math.cos(conic.rotation) - localY * Math.sin(conic.rotation);
                const y = conic.cy + localX * Math.sin(conic.rotation) + localY * Math.cos(conic.rotation);
                coords.push(`(${fmt(x)}, ${fmt(y)})`);
              }
              code += `    line(\n      ${coords.join(",\n      ")},\n      close: true${strokeStr}${polyFillStr}\n    )\n`;
            } else if (conic?.kind === "hyperbola") {
              for (const sign of [-1, 1]) {
                const coords = [];
                for (let sampleIndex = 0; sampleIndex <= 80; sampleIndex++) {
                  const t = -2.4 + 4.8 * sampleIndex / 80;
                  const localX = sign * conic.major * Math.cosh(t);
                  const localY = conic.minor * Math.sinh(t);
                  const x = conic.cx + localX * Math.cos(conic.rotation) - localY * Math.sin(conic.rotation);
                  const y = conic.cy + localX * Math.sin(conic.rotation) + localY * Math.cos(conic.rotation);
                  coords.push(`(${fmt(x)}, ${fmt(y)})`);
                }
                code += `    line(\n      ${coords.join(",\n      ")}${strokeStr}\n    )\n`;
              }
            } else if (conic?.kind === "parabola") {
              const trace = conic.a + conic.c;
              const firstRow = Math.hypot(conic.a, conic.b) > 1e-9;
              const length = firstRow ? Math.hypot(conic.a, conic.b) : Math.hypot(conic.b, conic.c);
              const ux = firstRow ? conic.a / length : conic.b / length;
              const uy = firstRow ? conic.b / length : conic.c / length;
              const vx = -uy, vy = ux;
              const ds = conic.d * ux + conic.e * uy;
              const dt = conic.d * vx + conic.e * vy;
              if (Math.abs(trace) > 1e-9 && Math.abs(dt) > 1e-9) {
                const coords = [];
                for (let sampleIndex = 0; sampleIndex <= 120; sampleIndex++) {
                  const s = -8 + 16 * sampleIndex / 120;
                  const t = -(trace * s * s + 2 * ds * s + conic.f) / (2 * dt);
                  const x = ux * s + vx * t;
                  const y = uy * s + vy * t;
                  if (Math.abs(x) <= 20 && Math.abs(y) <= 20) coords.push(`(${fmt(x)}, ${fmt(y)})`);
                }
                if (coords.length > 1) code += `    line(\n      ${coords.join(",\n      ")}${strokeStr}\n    )\n`;
              }
            } else if (cmdInfo) {
              code += `    // Unhandled conic command: ${cmdInfo.name}\n`;
            }
          }
        }
        else if (type === "angle") {
          if (cmdInfo && cmdInfo.name === "Angle") {
             let pA = points[cmdInfo.inputs[0]];
             let pB = points[cmdInfo.inputs[1]];
             let pC = points[cmdInfo.inputs[2]];
             if (pA && pB && pC) {
                 let ba_x = pA.x - pB.x; let ba_y = pA.y - pB.y;
                 let bc_x = pC.x - pB.x; let bc_y = pC.y - pB.y;
                 let dot = ba_x * bc_x + ba_y * bc_y;
                 let lenBA = Math.hypot(ba_x, ba_y);
                 let lenBC = Math.hypot(bc_x, bc_y);
                 let cosTheta = dot / (lenBA * lenBC);
                 
                 let arcSize = el.getElementsByTagName("arcSize")[0]?.getAttribute("val") || "30";
                 let angleRadius = Math.max(0.2, (parseFloat(arcSize) / 30) * 0.4);
                 
                 let isRightAngle = Math.abs(cosTheta) < 0.05 || el.getElementsByTagName("outlyingIntersections")[0]?.getAttribute("val") === "true"; 
                 
                 let startAngle = Math.atan2(ba_y, ba_x) * 180 / Math.PI;
                 let stopAngle = Math.atan2(bc_y, bc_x) * 180 / Math.PI;
                 if (stopAngle < startAngle) stopAngle += 360;
                 
                 if (isRightAngle) {
                     let ux = ba_x / lenBA * angleRadius; let uy = ba_y / lenBA * angleRadius;
                     let vx = -ba_y / lenBA * angleRadius; let vy = ba_x / lenBA * angleRadius;
                     if (-ba_y * bc_x + ba_x * bc_y < 0) { vx = -vx; vy = -vy; }
                     let pt1x = pB.x + ux; let pt1y = pB.y + uy;
                     let pt2x = pB.x + ux + vx; let pt2y = pB.y + uy + vy;
                     let pt3x = pB.x + vx; let pt3y = pB.y + vy;
                     code += `    line((${fmt(pB.x)}, ${fmt(pB.y)}), (${fmt(pt1x)}, ${fmt(pt1y)}), (${fmt(pt2x)}, ${fmt(pt2y)}), (${fmt(pt3x)}, ${fmt(pt3y)}), close: true${strokeStr}${polyFillStr})\n`;
                 } else {
                     code += `    arc((${fmt(pB.x)}, ${fmt(pB.y)}), start: ${fmt(startAngle)}deg, stop: ${fmt(stopAngle)}deg, radius: ${fmt(angleRadius)}, mode: "PIE"${strokeStr}${polyFillStr})\n`;
                 }
             }
          }
        }
        else if (type === "text") {
          let label = el.getAttribute("label");
          let val = "";
          if (window.ggbApplet) {
             val = window.ggbApplet.getValueString(label);
          }
          if (!val) {
             let textNode = el.getElementsByTagName("textString")[0] || el.getElementsByTagName("text")[0];
             val = textNode ? textNode.getAttribute("val") : el.textContent.trim();
          }
          if (!val) val = "UNKNOWN";

          if (val) {
             let isLaTeX = el.getElementsByTagName("isLaTeX")[0]?.getAttribute("val") === "true";
             let contentStr = isLaTeX ? `[$${val}$]` : `[${val}]`;
             
             let coordStr = `(0, 0)`; // Bulletproof fallback
             let gotCoord = false;
             if (window.ggbApplet) {
                let x = window.ggbApplet.getXcoord(label);
                let y = window.ggbApplet.getYcoord(label);
                // GeoGebra API returns valid numbers for texts if they are defined on the plane
                if (!isNaN(x) && !isNaN(y) && (x !== 0 || y !== 0 || val !== "UNKNOWN")) {
                    coordStr = `(${fmt(x)}, ${fmt(y)})`;
                    gotCoord = true;
                }
             }

             if (!gotCoord) {
                 let startPoint = el.getElementsByTagName("startPoint")[0];
                 if (startPoint) {
                    let spExp = startPoint.getAttribute("exp");
                    if (spExp && points[spExp]) {
                       coordStr = `(${points[spExp].x}, ${points[spExp].y})`;
                    } else if (startPoint.hasAttribute("x") && startPoint.hasAttribute("y")) {
                       let spX = parseFloat(startPoint.getAttribute("x"));
                       let spY = parseFloat(startPoint.getAttribute("y"));
                       let spZ = parseFloat(startPoint.getAttribute("z") || "1");
                       coordStr = `(${fmt(spX/spZ)}, ${fmt(spY/spZ)})`;
                    }
                 } else {
                    let absLoc = el.getElementsByTagName("absoluteScreenLocation")[0];
                    if (absLoc) {
                       coordStr = `(0, 0)`;
                    }
                 }
             }
             
             code += `    content(${coordStr}, ${contentStr})\n`;
          }
        }
        else if (type === "function") {
           if (window.ggbApplet) {
               let xMin = numericInput(window.ggbApplet.getValue('x(Corner(1))'), -8);
               let xMax = numericInput(window.ggbApplet.getValue('x(Corner(2))'), 8);
               let yMin = numericInput(window.ggbApplet.getValue('y(Corner(1))'), -5);
               let yMax = numericInput(window.ggbApplet.getValue('y(Corner(3))'), 5);
               let steps = 180;
               let dx = (xMax - xMin) / steps;
               let segments = [];
               let pts = [];
               for (let i = 0; i <= steps; i++) {
                   let x = xMin + i * dx;
                   let y = numericInput(window.ggbApplet.getValue(label + "(" + x + ")"));
                   const valid = Number.isFinite(y) && y >= yMin - 2 * (yMax - yMin) && y <= yMax + 2 * (yMax - yMin);
                   const jump = pts.length && Math.abs(y - pts[pts.length - 1].y) > .8 * (yMax - yMin);
                   if (!valid || jump) {
                     if (pts.length > 1) segments.push(pts);
                     pts = valid ? [{ x, y }] : [];
                   } else {
                     pts.push({ x, y });
                   }
               }
               if (pts.length > 1) segments.push(pts);
               for (const segment of segments) {
                 const coords = segment.map(p => `(${fmt(p.x)}, ${fmt(p.y)})`);
                 code += `    line(\n      ${coords.join(",\n      ")}${strokeStr}\n    )\n`;
               }
           }
        }
        else {
          if (!["point", "numeric", "boolean", "angle", "line", "quadric", "polyhedron", "pyramid", "surface", "conicpart", "sector", "curve"].includes(type)) {
            code += `    // Unhandled element type: ${type} (Command: ${cmdInfo ? cmdInfo.name : 'none'})\n`;
          }
        }
      }

      code += `  })\n]`;
      document.getElementById('codeOutput').value = code;
      
      // Auto compile if hiệu ứng đang biên dịch đẹp đẳng cấp is ready
      if (window.compileTypstToSvg) {
        triggerTypstCompile(true);
      }
    }

    function copyCode() {
      const txt = document.getElementById('codeOutput');
      txt.select();
      document.execCommand('copy');
      const btn = document.querySelector('.btn-primary');
      const orig = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="check" style="width: 14px; height: 14px;"></i> Copied!';
      window.lucide?.createIcons();
      setTimeout(() => {
        btn.innerHTML = orig;
        window.lucide?.createIcons();
      }, 2000);
    }

    // Handle window resize for GeoGebra
    window.addEventListener('resize', () => {
      if (window.ggbApplet) {
        const size = getPanelSize();
        ggbApplet.setSize(size.width, size.height);
      }
    });

    async function triggerTypstCompile(silent = false) {
      const overlay = document.getElementById('compileOverlay');
      const container = document.getElementById('compiledSvgContainer');
      if (!silent) overlay.style.display = 'flex';

      try {
        const cetzCode = document.getElementById('codeOutput').value;
        if (window.compileTypstToSvg) {
          const svgMarkup = await window.compileTypstToSvg(cetzCode);
          container.innerHTML = svgMarkup;
        } else {
          if (!silent) container.innerHTML = `<div style="color:#ef4444; font-weight:600; font-size:0.8rem; text-align:center;">Hiệu ứng đang biên dịch đẹp đẳng cấp đang khởi tạo. Vui lòng thử lại sau 2 giây.</div>`;
        }
      } catch (err) {
        // Only show error text if it's not a silent realtime update, or display it gently
        if (!silent) {
          container.innerHTML = `<pre style="color:#ef4444; font-size:0.75rem; background:#fee2e2; border:1px solid #fecaca; padding:12px; border-radius:6px; text-align:left; width:100%; overflow:auto;">Biên dịch lỗi:\n${err.message}</pre>`;
        }
      } finally {
        if (!silent) overlay.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.lucide?.createIcons();
      
      // Auto compile when user edits the code manually
      const codeOutput = document.getElementById('codeOutput');
      let editTimeout;
      codeOutput.addEventListener('input', () => {
         clearTimeout(editTimeout);
         editTimeout = setTimeout(() => {
            if (window.compileTypstToSvg) {
               triggerTypstCompile(true);
            }
         }, 500);
      });
      
      document.getElementById('btnTriggerCompile').addEventListener('click', triggerTypstCompile);
    });

    // Monkey-patch btoa for unicode support in GeoGebra
    var originalBtoa = window.btoa;
    window.btoa = function(str) {
       try { return originalBtoa(str); }
       catch(e) { return originalBtoa(unescape(encodeURIComponent(str))); }
    };

    window.addEventListener('load', () => {
      setTimeout(initGeoGebra, 0);
    });
  </script>
</body>
</html>
