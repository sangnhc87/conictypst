        // ── Local-first save, import/export and Studio bridge ───
        function persistDrawing() {
            try {
                localStorage.setItem(DRAWING_STORAGE_KEY, JSON.stringify({
                    version: 2,
                    updatedAt: new Date().toISOString(),
                    shapes,
                    cam,
                    snapGrid
                }));
            } catch (error) {
                console.warn('Không thể tự lưu bản vẽ CeTZ:', error);
            }
        }

        function restoreDrawing() {
            try {
                const saved = JSON.parse(localStorage.getItem(DRAWING_STORAGE_KEY) || 'null');
                if (!saved || !Array.isArray(saved.shapes) || saved.shapes.length > MAX_IMPORT_SHAPES) return;
                shapes = saved.shapes;
                if (saved.cam && Number.isFinite(saved.cam.ox) && Number.isFinite(saved.cam.oy) && Number.isFinite(saved.cam.zoom)) cam = saved.cam;
                if ([0, 0.25, 0.5, 1].includes(saved.snapGrid)) snapGrid = saved.snapGrid;
                historyStack = [JSON.parse(JSON.stringify(shapes))];
                historyIndex = 0;
            } catch (error) {
                console.warn('Bỏ qua bản vẽ tự lưu không hợp lệ:', error);
            }
        }

        function downloadFile(content, fileName, mime) {
            const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = fileName;
            anchor.click();
            setTimeout(() => URL.revokeObjectURL(anchor.href), 1200);
        }

        function exportDrawing() {
            const payload = JSON.stringify({
                format: 'conictypst-cetz-board',
                version: 2,
                exportedAt: new Date().toISOString(),
                shapes,
                cam,
                snapGrid
            }, null, 2);
            downloadFile(payload, `conictypst-cetz-${new Date().toISOString().slice(0, 10)}.json`, 'application/json;charset=utf-8');
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đã lưu bản vẽ JSON', showConfirmButton: false, timer: 1500 });
        }

        async function importDrawing(event) {
            const input = event.target;
            const file = input.files?.[0];
            input.value = '';
            if (!file) return;
            try {
                const payload = JSON.parse(await file.text());
                if (!Array.isArray(payload.shapes) || payload.shapes.length > MAX_IMPORT_SHAPES) throw new Error('Tệp không đúng định dạng hoặc có quá nhiều đối tượng.');
                shapes = payload.shapes;
                selectedId = null;
                ts = null;
                if (payload.cam && Number.isFinite(payload.cam.ox) && Number.isFinite(payload.cam.oy) && Number.isFinite(payload.cam.zoom)) cam = payload.cam;
                if ([0, 0.25, 0.5, 1].includes(payload.snapGrid)) snapGrid = payload.snapGrid;
                historyStack = [JSON.parse(JSON.stringify(shapes))];
                historyIndex = 0;
                persistDrawing();
                drawGrid();
                render();
                updateHistoryButtons();
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: `Đã mở ${shapes.length} đối tượng`, showConfirmButton: false, timer: 1700 });
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Không mở được bản vẽ', text: error.message });
            }
        }

        function exportSvg() {
            if (!svg || shapes.length === 0) return;
            const clone = svg.cloneNode(true);
            clone.querySelector('#gridGroup')?.remove();
            clone.querySelector('#previewGroup')?.remove();
            clone.querySelector('#snapGroup')?.remove();
            clone.querySelector('#handlesGroup')?.remove();
            clone.querySelector('#coordText')?.remove();
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttribute('viewBox', `0 0 ${svg.clientWidth} ${svg.clientHeight}`);
            clone.setAttribute('width', String(svg.clientWidth));
            clone.setAttribute('height', String(svg.clientHeight));
            const background = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            background.setAttribute('width', '100%');
            background.setAttribute('height', '100%');
            background.setAttribute('fill', '#ffffff');
            clone.insertBefore(background, clone.firstChild);
            const source = `<?xml version="1.0" encoding="UTF-8"?>\n${new XMLSerializer().serializeToString(clone)}`;
            downloadFile(source, `conictypst-cetz-${new Date().toISOString().slice(0, 10)}.svg`, 'image/svg+xml;charset=utf-8');
        }

        function openInStudio() {
            if (shapes.length === 0) {
                Swal.fire({ icon: 'info', title: 'Bản vẽ đang trống', text: 'Hãy vẽ hoặc chèn một hình mẫu trước khi chuyển sang Studio.' });
                return;
            }

            const requestId = `cetz-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
            const payload = {
                requestId,
                name: `Hình CeTZ ${new Intl.DateTimeFormat('vi-VN', { dateStyle: 'short', timeStyle: 'short' }).format(new Date())}`,
                content: genCeTZ(shapes)
            };
            const bytes = new TextEncoder().encode(JSON.stringify(payload));
            let binary = '';
            for (let offset = 0; offset < bytes.length; offset += 8192) {
                binary += String.fromCharCode(...bytes.subarray(offset, offset + 8192));
            }
            const bridge = btoa(binary).replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/g, '');

            if (bridge.length > 180000) {
                navigator.clipboard?.writeText(payload.content).catch(() => {});
                window.open(`${STUDIO_ORIGIN}/#studio`, '_blank', 'noopener');
                Swal.fire({ icon: 'warning', title: 'Bản vẽ quá lớn để chuyển tự động', text: 'Studio đã được mở và mã CeTZ đã được copy để bạn dán vào tệp mới.' });
                return;
            }

            const studio = window.open(`${STUDIO_ORIGIN}/#studio?bridge=${encodeURIComponent(bridge)}`, '_blank', 'noopener');
            if (!studio) {
                navigator.clipboard?.writeText(payload.content).catch(() => {});
                Swal.fire({ icon: 'warning', title: 'Trình duyệt đã chặn cửa sổ', text: 'Mã CeTZ đã được copy. Hãy cho phép pop-up rồi thử lại.' });
                return;
            }

            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đang tạo dự án CeTZ trong Studio…', showConfirmButton: false, timer: 1900 });
        }

            const typeLabels = { point: 'Điểm', segment: 'Đoạn thẳng', arrow: 'Vectơ', line: 'Đường thẳng', ray: 'Tia', polygon: 'Đa giác', circle: 'Đường tròn', ellipse: 'Elip', arc: 'Cung tròn', bezier: 'Bezier', angle: 'Góc', text: 'Chữ' };

                        <option value="dotted" ${s.dash === 'dotted' ? 'selected' : ''}>Chấm</option>
                    </select>
                </div>`;
                html += `<div class="prop-row">
                    <span class="prop-label">Độ dày</span>

            }

            // Fill Row
            if (hasFill) {

                    <span class="prop-label">Tô màu</span>
                    <div style="display:flex; gap:6px; flex-wrap:wrap; flex:1; align-items:center;">
                        <div class="color-dot ${!s.fill ? 'active' : ''}" style="background:#0f172a; border:1.5px dashed #475569; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:9px;" onclick="updateProp('fill', '')">x</div>`;
                COLORS.forEach(c => {
                    html += `<div class="color-dot ${s.fill === c ? 'active' : ''}" style="background:${c};" onclick="updateProp('fill', '${c}')"></div>`;
                });
                html += `</div></div>`;

                if (s.fill) {
                    html += `<div class="prop-row">
                        <span class="prop-label">Độ mờ</span>
                        <select class="prop-input" onchange="updateProp('fillOpacity', parseFloat(this.value))">
                            <option value="0.1" ${s.fillOpacity === 0.1 ? 'selected' : ''}>10%</option>
                            <option value="0.15" ${s.fillOpacity === 0.15 || !s.fillOpacity ? 'selected' : ''}>15%</option>
                            <option value="0.3" ${s.fillOpacity === 0.3 ? 'selected' : ''}>30%</option>
                            <option value="0.5" ${s.fillOpacity === 0.5 ? 'selected' : ''}>50%</option>
                            <option value="0.8" ${s.fillOpacity === 0.8 ? 'selected' : ''}>80%</option>
                            <option value="1" ${s.fillOpacity === 1 ? 'selected' : ''}>100%</option>
                        </select>
                    </div>`;
                }
            }

            // Specific coords / parameters
            if (s.type === 'point') {
                html += `<div class="prop-row">
                    <span class="prop-label">Tên điểm</span>

                </div>`;
                html += `<div class="prop-row">
                    <span class="prop-label">Hiện nhãn</span>
                    <input type="checkbox" ${s.label !== false ? 'checked' : ''} onchange="updateProp('label', this.checked)" />
                </div>`;
                html += `<div class="prop-row">
                    <span class="prop-label">Tọa độ X</span>
                    <input type="number" class="prop-input" value="${fmtN(s.x)}" step="0.1" onchange="updateProp('x', parseFloat(this.value))" />
                </div>`;
                html += `<div class="prop-row">

                    <span class="prop-label">Bán trục X</span>

                    <span class="prop-label">Bán trục Y</span>
                    <input type="number" class="prop-input" value="${s.ry}" min="0.05" step="0.1" onchange="updateProp('ry', parseFloat(this.value))" />

                </div>`;
                html += `<div class="prop-row">
                    <span class="prop-label">Góc đầu (độ)</span>
                    <input type="number" class="prop-input" value="${s.startAngle}" step="5" onchange="updateProp('startAngle', parseFloat(this.value))" />
                </div>`;
                html += `<div class="prop-row">
                    <span class="prop-label">Góc cuối (độ)</span>
                    <input type="number" class="prop-input" value="${s.endAngle}" step="5" onchange="updateProp('endAngle', parseFloat(this.value))" />
                </div>`;
                html += `<div class="prop-row">
                    <span class="prop-label">Cung lớn</span>
                    <input type="checkbox" ${s.large ? 'checked' : ''} onchange="updateProp('large', this.checked)" />
                </div>`;
            } else if (s.type === 'angle') {
                html += `<div class="prop-row">
                    <span class="prop-label">Góc vuông</span>

                    <span class="prop-label">Cung bán kính</span>

                </div>`;
            } else if (s.type === 'text') {
                html += `<div class="prop-row">
                    <span class="prop-label">Nội dung</span>
                    <input type="text" class="prop-input" value="${s.text || ''}" oninput="updateProp('text', this.value)" />
                </div>`;
                html += `<div class="prop-row">
                    <span class="prop-label">Cỡ chữ</span>
                    <input type="number" class="prop-input" value="${s.fontSize || 16}" min="8" max="72" onchange="updateProp('fontSize', parseInt(this.value))" />
                </div>`;
            }

            html += `</div>`;
            propertiesBody.innerHTML = html;
        }

        function updateProp(key, val) {
            if (!selectedId) return;
            shapes = shapes.map(s => {
                if (s.id === selectedId) {
                    return { ...s, [key]: val };
                }
                return s;
            });
            render();
            // Do not push history on input type/slide immediately, but standard inputs yes.
            // For simplicity in Vanilla JS, push on change
            pushHistory();
        }

                        { id: idC, type: 'point', x: 4, y: 3, name: 'C', color: COLORS[0], label: true },
                        { id: idD, type: 'point', x: 0, y: 3, name: 'D', color: COLORS[0], label: true },
                        { id: freshUid(), type: 'polygon', vertices: [[0, 0], [4, 0], [4, 3], [0, 3]], bindV: [idA, idB, idC, idD], color: COLORS[0], fill: '', dash: 'solid', width: 2 }
                    ];
                    break;
                }
                case 'square': {
                    const idA = freshUid(), idB = freshUid(), idC = freshUid(), idD = freshUid();
                    list = [
                        { id: idA, type: 'point', x: 0, y: 0, name: 'A', color: COLORS[0], label: true },
                        { id: idB, type: 'point', x: 3, y: 0, name: 'B', color: COLORS[0], label: true },
                        { id: idC, type: 'point', x: 3, y: 3, name: 'C', color: COLORS[0], label: true },
                        { id: idD, type: 'point', x: 0, y: 3, name: 'D', color: COLORS[0], label: true },
                        { id: freshUid(), type: 'polygon', vertices: [[0, 0], [3, 0], [3, 3], [0, 3]], bindV: [idA, idB, idC, idD], color: COLORS[0], fill: '', dash: 'solid', width: 2 }
                    ];
                    break;
                }
                case 'para': {
                    const idA = freshUid(), idB = freshUid(), idC = freshUid(), idD = freshUid();
                    list = [
                        { id: idA, type: 'point', x: 0, y: 0, name: 'A', color: COLORS[0], label: true },
                        { id: idB, type: 'point', x: 4, y: 0, name: 'B', color: COLORS[0], label: true },
                        { id: idC, type: 'point', x: 5, y: 2.5, name: 'C', color: COLORS[0], label: true },
                        { id: idD, type: 'point', x: 1, y: 2.5, name: 'D', color: COLORS[0], label: true },
                        { id: freshUid(), type: 'polygon', vertices: [[0, 0], [4, 0], [5, 2.5], [1, 2.5]], bindV: [idA, idB, idC, idD], color: COLORS[0], fill: '', dash: 'solid', width: 2 }
                    ];
                    break;
                }
                case 'trap': {
                    const idA = freshUid(), idB = freshUid(), idC = freshUid(), idD = freshUid();
                    list = [
                        { id: idA, type: 'point', x: 0, y: 0, name: 'A', color: COLORS[0], label: true },
                        { id: idB, type: 'point', x: 5, y: 0, name: 'B', color: COLORS[0], label: true },
                        { id: idC, type: 'point', x: 4, y: 2.5, name: 'C', color: COLORS[0], label: true },
                        { id: idD, type: 'point', x: 1, y: 2.5, name: 'D', color: COLORS[0], label: true },
                        { id: freshUid(), type: 'polygon', vertices: [[0, 0], [5, 0], [4, 2.5], [1, 2.5]], bindV: [idA, idB, idC, idD], color: COLORS[0], fill: '', dash: 'solid', width: 2 }
                    ];
                    break;
                }
                case 'circle_o': {
                    const idO = freshUid();
                    list = [
                        { id: idO, type: 'point', x: 0, y: 0, name: 'O', color: COLORS[0], label: true },
                        { id: freshUid(), type: 'circle', cx: 0, cy: 0, r: 2.5, bindCenter: idO, color: COLORS[0], fill: '', dash: 'solid', width: 2 }
                    ];
                    break;
                }
                case 'oxy_2d': {
                    list = [
                        { id: freshUid(), type: 'arrow', x1: -1, y1: 0, x2: 6, y2: 0, color: COLORS[0], dash: 'solid', width: 1.5 },
                        { id: freshUid(), type: 'arrow', x1: 0, y1: -1, x2: 0, y2: 5, color: COLORS[0], dash: 'solid', width: 1.5 },
                        { id: freshUid(), type: 'point', x: 0, y: 0, name: 'O', color: COLORS[0], label: true },
                        { id: freshUid(), type: 'text', x: 6.2, y: 0, text: 'x', color: COLORS[0], fontSize: 14 },
                        { id: freshUid(), type: 'text', x: 0.15, y: 5.2, text: 'y', color: COLORS[0], fontSize: 14 }
                    ];
                    break;
                }
                case 'oxyz_3d': {
                    const zx = fmtN(5 * Math.cos(45 * DEG) * 0.5);
                    const zy = fmtN(5 * Math.sin(45 * DEG) * 0.5);
                    list = [
                        { id: freshUid(), type: 'arrow', x1: 0, y1: 0, x2: 5, y2: 0, color: COLORS[2], dash: 'solid', width: 2 },
                        { id: freshUid(), type: 'arrow', x1: 0, y1: 0, x2: 0, y2: 5, color: COLORS[3], dash: 'solid', width: 2 },
                        { id: freshUid(), type: 'arrow', x1: 0, y1: 0, x2: zx, y2: zy, color: COLORS[1], dash: 'dashed', width: 1.5 },
                        { id: freshUid(), type: 'text', x: 5.3, y: 0, text: 'x', color: COLORS[2], fontSize: 14 },
                        { id: freshUid(), type: 'text', x: 0.15, y: 5.3, text: 'y', color: COLORS[3], fontSize: 14 },
                        { id: freshUid(), type: 'text', x: zx + 0.2, y: zy + 0.2, text: 'z', color: COLORS[1], fontSize: 14 }
                    ];
                    break;
                }
                case 'cube_3d': {
                    const a = 2.5;
                    const p = (x, y, z) => {
                        const px = x + z * Math.cos(45 * DEG) * 0.55;
                        const py = y + z * Math.sin(45 * DEG) * 0.55;
                        return [fmtN(px), fmtN(py)];
                    };
                    const pts = {
                        A: p(0, 0, 0), B: p(a, 0, 0), C: p(a, a, 0), D: p(0, a, 0),
                        E: p(0, 0, a), F: p(a, 0, a), G: p(a, a, a), H: p(0, a, a)
                    };
                    const seg = (p1, p2, dsh = 'solid') => ({ id: freshUid(), type: 'segment', x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], color: COLORS[0], dash: dsh, width: 1.5 });
                    list = [
                        seg(pts.A, pts.B, 'dashed'), seg(pts.A, pts.D, 'dashed'), seg(pts.A, pts.E, 'dashed'),
                        seg(pts.B, pts.C), seg(pts.C, pts.D), seg(pts.D, pts.H),
                        seg(pts.B, pts.F), seg(pts.C, pts.G), seg(pts.E, pts.F),
                        seg(pts.F, pts.G), seg(pts.G, pts.H), seg(pts.H, pts.E)
                    ];
                    break;
                }
                case 'box_3d': {
                    const [W, H, D] = [3.5, 2.5, 1.8];
                    const p = (x, y, z) => {
                        const px = x + z * Math.cos(45 * DEG) * 0.55;
                        const py = y + z * Math.sin(45 * DEG) * 0.55;
                        return [fmtN(px), fmtN(py)];
                    };
                    const pts = {
                        A: p(0, 0, 0), B: p(W, 0, 0), C: p(W, H, 0), D: p(0, H, 0),
                        E: p(0, 0, D), F: p(W, 0, D), G: p(W, H, D), H: p(0, H, D)
                    };
                    const seg = (p1, p2, dsh = 'solid') => ({ id: freshUid(), type: 'segment', x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], color: COLORS[0], dash: dsh, width: 1.5 });
                    list = [
                        seg(pts.A, pts.B, 'dashed'), seg(pts.A, pts.D, 'dashed'), seg(pts.A, pts.E, 'dashed'),
                        seg(pts.B, pts.C), seg(pts.C, pts.D), seg(pts.D, pts.H),
                        seg(pts.B, pts.F), seg(pts.C, pts.G), seg(pts.E, pts.F),
                        seg(pts.F, pts.G), seg(pts.G, pts.H), seg(pts.H, pts.E)
                    ];
                    break;
                }
                case 'pyramid_3d': {
                    const pts = { A: [0, 0], B: [4, 0], C: [5, 1.35], D: [1, 1.35], S: [2.45, 4] };
                    const point = (name, p) => ({ id: freshUid(), type: 'point', x: p[0], y: p[1], name, color: COLORS[0], label: true });
                    const seg = (a, b, dash = 'solid') => ({ id: freshUid(), type: 'segment', x1: pts[a][0], y1: pts[a][1], x2: pts[b][0], y2: pts[b][1], color: COLORS[0], dash, width: 1.6 });
                    list = [
                        seg('A', 'B'), seg('B', 'C'), seg('C', 'D'), seg('D', 'A', 'dashed'),
                        seg('S', 'A'), seg('S', 'B'), seg('S', 'C'), seg('S', 'D', 'dashed'),
                        ...Object.entries(pts).map(([name, p]) => point(name, p))
                    ];
                    break;
                }
                case 'prism_3d': {
                    const pts = { A: [0, 0], B: [3.6, 0], C: [1.7, 2.5], D: [1.1, 1.1], E: [4.7, 1.1], F: [2.8, 3.6] };
                    const point = (name, p) => ({ id: freshUid(), type: 'point', x: p[0], y: p[1], name, color: COLORS[0], label: true });
                    const seg = (a, b, dash = 'solid') => ({ id: freshUid(), type: 'segment', x1: pts[a][0], y1: pts[a][1], x2: pts[b][0], y2: pts[b][1], color: COLORS[0], dash, width: 1.6 });
                    list = [
                        seg('A', 'B'), seg('B', 'C'), seg('C', 'A'),
                        seg('D', 'E', 'dashed'), seg('E', 'F'), seg('F', 'D', 'dashed'),
                        seg('A', 'D', 'dashed'), seg('B', 'E'), seg('C', 'F'),
                        ...Object.entries(pts).map(([name, p]) => point(name, p))
                    ];
                    break;
                }
                case 'cylinder_3d': {
                    list = [
                        { id: freshUid(), type: 'ellipse', cx: 0, cy: 0, rx: 2.35, ry: 0.65, color: COLORS[0], fill: '', dash: 'solid', width: 1.6 },
                        { id: freshUid(), type: 'ellipse', cx: 0, cy: 3.8, rx: 2.35, ry: 0.65, color: COLORS[0], fill: '', dash: 'solid', width: 1.6 },
                        { id: freshUid(), type: 'segment', x1: -2.35, y1: 0, x2: -2.35, y2: 3.8, color: COLORS[0], dash: 'solid', width: 1.6 },
                        { id: freshUid(), type: 'segment', x1: 2.35, y1: 0, x2: 2.35, y2: 3.8, color: COLORS[0], dash: 'solid', width: 1.6 },
                        { id: freshUid(), type: 'segment', x1: 0, y1: 0, x2: 0, y2: 3.8, color: COLORS[1], dash: 'dashed', width: 1.2 },
                        { id: freshUid(), type: 'point', x: 0, y: 0, name: 'O', color: COLORS[0], label: true },
                        { id: freshUid(), type: 'point', x: 0, y: 3.8, name: "O'", color: COLORS[0], label: true }
                    ];
                    break;
                }
                case 'cone_3d': {
                    list = [
                        { id: freshUid(), type: 'ellipse', cx: 0, cy: 0, rx: 2.5, ry: 0.7, color: COLORS[0], fill: '', dash: 'solid', width: 1.6 },
                        { id: freshUid(), type: 'segment', x1: -2.5, y1: 0, x2: 0, y2: 4.2, color: COLORS[0], dash: 'solid', width: 1.6 },
                        { id: freshUid(), type: 'segment', x1: 2.5, y1: 0, x2: 0, y2: 4.2, color: COLORS[0], dash: 'solid', width: 1.6 },
                        { id: freshUid(), type: 'segment', x1: 0, y1: 0, x2: 0, y2: 4.2, color: COLORS[1], dash: 'dashed', width: 1.2 },
                        { id: freshUid(), type: 'point', x: 0, y: 0, name: 'O', color: COLORS[0], label: true },
                        { id: freshUid(), type: 'point', x: 0, y: 4.2, name: 'S', color: COLORS[0], label: true }
                    ];
                    break;
                }
            }

            if (list.length > 0) {
                shapes = shapes.concat(list);
                pushHistory();
                render();
            }
        }

        function insertAxes3D() {
            insertTemplate('oxyz_3d');
        }

        function clearCanvas() {
            Swal.fire({
                title: 'Xóa toàn bộ hình?',
                text: 'Bạn sẽ mất toàn bộ các đối tượng hình vẽ hiện tại!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#334155',
                confirmButtonText: 'Đồng ý xóa',
                cancelButtonText: 'Hủy bỏ'
            }).then((result) => {
                if (result.isConfirmed) {
                    shapes = [];
                    selectedId = null;
                    ts = null;
                    pushHistory();
                    render();
                }
            });
        }

        function resetView() {
            const rect = svg.getBoundingClientRect();
            cam = { ox: rect.width / 2, oy: rect.height / 2, zoom: DEFAULT_ZOOM };
            drawGrid();
            render();
            persistDrawing();
        }
    </script>
</body>

</html>
