name: Deploy Sang Math Graphics to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'typst-pkg-sang-math-graphics/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-sang-math-graphics'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Build web
        run: |
          cd typst-pkg-sang-math-graphics
          bash scripts/build-web.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: typst-pkg-sang-math-graphics/docs/src/.vitepress/dist

  deploy:
    environment:
      name: github-pages-sang-math-graphics
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
