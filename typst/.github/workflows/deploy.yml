name: Deploy Web and Typst

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Quyền ghi cho Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web-and-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build:public

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile Typst PDFs
        run: |
          mkdir -p dist/pdfs
          for file in typst/exams/de-*.typ; do
            if [ -f "$file" ]; then
              base=$(basename "$file" .typ)
              echo "Compiling $base..."
              typst compile "$file" "dist/pdfs/$base.pdf" --root typst || true
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
