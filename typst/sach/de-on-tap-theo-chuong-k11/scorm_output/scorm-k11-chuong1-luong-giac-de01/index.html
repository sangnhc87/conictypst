<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
  --blue: #3b82f6; --blue-dim: #eff6ff;
  --green: #16a34a; --green-dim: #f0fdf4;
  --red: #dc2626; --red-dim: #fef2f2;
  --yellow: #eab308; --yellow-dim: #fefce8;
  --text: #0f172a; --muted: #475569;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
}
.header {
  background: linear-gradient(135deg,#003087 0%,#0047b3 100%);
  padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5); flex-shrink: 0;
}
.header-info .school { font-size:10px; color:#90caf9; }
.header-info .title  { font-size:15px; font-weight:700; color:#fff; margin:2px 0; }
.header-info .sub    { font-size:11px; color:#bbdefb; }
.progress-wrap {
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.progress-ring {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: conic-gradient(var(--blue) 0%, #1e2030 0%);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.4s;
}
.progress-ring-inner {
  width: 36px; height: 36px; background: #003087;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.score-badge {
  background: rgba(0,0,0,0.1);
  border: 1px solid rgba(0,0,0,0.2);
  padding: 4px 12px; border-radius: 20px;
  font-size: 12px; color: #fff; font-weight: 600;
  min-width: 70px; text-align: center;
}
.main { flex: 1; padding: 16px 20px; max-width: 860px; margin: 0 auto; width: 100%; }
.section-header {
  font-size: 11px; font-weight: 700; color: var(--blue);
  letter-spacing: 1px; text-transform: uppercase;
  margin: 20px 0 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  transition: border-color 0.2s;
}
.card.answered { border-color: var(--blue-dim); }
.card.correct  { border-color: var(--green); background: var(--green-dim); }
.card.wrong    { border-color: var(--red);   background: var(--red-dim); }
.q-header {
  display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px;
}
.q-num {
  background: var(--blue); color: #fff;
  border-radius: 6px; padding: 2px 8px;
  font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
}
.q-num.ds-type { background: #7c3aed; }
.q-num.tln-type { background: #0891b2; }
.q-stem { font-size: 14px; line-height: 1.6; white-space: pre-line; }
.options { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
.opt {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px; border-radius: 8px;
  border: 1px solid var(--border); cursor: pointer;
  transition: all 0.15s; font-size: 13.5px; line-height: 1.5;
  background: rgba(0,0,0,0.02);
}
.opt:hover:not(.disabled) { border-color: var(--blue); background: rgba(76,142,247,0.08); }
.opt .label {
  min-width: 24px; height: 24px;
  border: 2px solid var(--muted); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
  transition: all 0.15s;
}
.opt.selected .label { border-color: var(--blue); background: var(--blue); color: #fff; }
.opt.show-correct  { border-color: var(--green); background: rgba(34,197,94,0.1); }
.opt.show-correct .label { border-color: var(--green); background: var(--green); color: #fff; }
.opt.show-wrong    { border-color: var(--red); background: rgba(239,68,68,0.1); }
.opt.show-wrong .label { border-color: var(--red); background: var(--red); color: #fff; }
.opt.disabled { cursor: default; }

/* DS checkboxes */
.ds-opt { cursor: pointer; padding: 8px 13px; border-radius: 8px;
  border: 1px solid var(--border); font-size: 13.5px; margin-bottom: 6px;
  display: flex; align-items: flex-start; gap: 10px; transition: all 0.15s;
  background: rgba(0,0,0,0.02);
}
.ds-opt:hover:not(.disabled) { border-color: #7c3aed; background: rgba(124,58,237,0.08); }
.ds-check { width: 22px; height: 22px; border-radius: 5px;
  border: 2px solid var(--muted); flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all 0.15s;
}
.ds-opt.selected .ds-check { border-color: #7c3aed; background: #7c3aed; color: #fff; }
.ds-opt.show-correct { border-color: var(--green); background: rgba(34,197,94,0.1); }
.ds-opt.show-correct .ds-check { border-color: var(--green); background: var(--green); color: #fff; }
.ds-opt.show-wrong { border-color: var(--red); background: rgba(239,68,68,0.1); }
.ds-opt.show-wrong .ds-check { border-color: var(--red); background: var(--red); color: #fff; }
.ds-opt.disabled { cursor: default; }

/* TLN input */
.tln-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.tln-input {
  flex: 1; background: rgba(0,0,0,0.05); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 13px; color: var(--text); font-size: 14px;
  outline: none; transition: border-color 0.15s;
}
.tln-input:focus { border-color: #0891b2; }
.tln-input.correct-input { border-color: var(--green); background: rgba(34,197,94,0.1); }
.tln-input.wrong-input { border-color: var(--red); background: rgba(239,68,68,0.1); }
.tln-input.disabled { cursor: default; }

/* Buttons */
.btn-check {
  background: var(--blue); color: #fff; border: none;
  padding: 9px 18px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: opacity 0.15s; white-space: nowrap;
}
.btn-check:hover { opacity: 0.85; }
.btn-check:disabled { opacity: 0.4; cursor: default; }
.btn-check.ds-btn { background: #7c3aed; }
.btn-check.tln-btn { background: #0891b2; }

/* Solution box */
.solution {
  margin-top: 12px; padding: 12px 14px;
  background: rgba(0,0,0,0.03); border-left: 3px solid var(--blue);
  border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.7;
  display: none; white-space: pre-line;
}
.solution.show { display: block; }
.solution-label { font-size: 10px; font-weight: 700; color: var(--blue);
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.feedback {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; margin-top: 8px;
  padding: 6px 10px; border-radius: 6px;
}
.feedback.ok { background: rgba(34,197,94,0.15); color: var(--green); }
.feedback.err { background: rgba(239,68,68,0.15); color: var(--red); }
.feedback.partial { background: rgba(250,204,21,0.15); color: var(--yellow); }

/* Footer */
.footer-bar {
  background: #080810; padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); flex-shrink: 0;
  font-size: 11px; color: var(--muted);
}
.btn-submit {
  background: linear-gradient(135deg, #16a34a, #15803d);
  color: #fff; border: none; padding: 8px 22px; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-weight: 700; transition: opacity 0.15s;
}
.btn-submit:hover { opacity: 0.88; }
.btn-submit:disabled { opacity: 0.4; cursor: default; }
.result-banner {
  display: none; text-align: center; padding: 30px 20px;
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); margin: 20px 0;
}
.result-banner.show { display: block; }
.result-score { font-size: 52px; font-weight: 800; }
.result-score.high { color: var(--green); }
.result-score.mid  { color: var(--yellow); }
.result-score.low  { color: var(--red); }
.result-msg { font-size: 16px; margin-top: 8px; color: var(--muted); }
</style>
</head>

", "$y = \\cot x$"], "correct": [0]}, {"type": "tn", "number": 8, "stem": "Số nghiệm của phương trình $\\cos x = \\dfrac{1}{2}$ trên đoạn $[0; 2\\pi]$ là", "solution": "Phương trình <br/> $\n \\cos x = \\dfrac{1}{2} \\Leftrightarrow x = \\dfrac{\\pi}{3} + k 2\\pi\n $<br/> hoặc $x = -\\dfrac{\\pi}{3} + k 2\\pi , (k \\in \\mathbb{Z})$.<br/><br/> Trên đoạn $[0; 2\\pi]$, phương trình có $2$ nghiệm là $x = \\dfrac{\\pi}{3}$ và $x = \\dfrac{5\\pi}{3}$.", "options": ["$2$", "$1$", "$3$", "$4$"], "correct": [0]}, {"type": "tn", "number": 9, "stem": "Nghiệm của phương trình $\\sin x = 0$ là", "solution": "Ta có <br/> $\n \\sin x = 0 \\Leftrightarrow x = k \\pi (k \\in \\mathbb{Z})\n $<br/>.", "options": ["$x = k \\pi, k \\in \\mathbb{Z}$", "$x = \\dfrac{\\pi}{2} + k \\pi, k \\in \\mathbb{Z}$", "$x = k 2\\pi, k \\in \\mathbb{Z}$", "$x = \\dfrac{\\pi}{2} + k 2\\pi, k \\in \\mathbb{Z}$"], "correct": [0]}, {"type": "tn", "number": 10, "stem": "Nghiệm của phương trình $\\tan x = 1$ là", "solution": "Ta có <br/> $\n \\tan x = 1 \\Leftrightarrow \\tan x = \\tan(\\dfrac{\\pi}{4}) \\Leftrightarrow x = \\dfrac{\\pi}{4} + k \\pi (k \\in \\mathbb{Z})\n $<br/>.", "options": ["$x = \\dfrac{\\pi}{4} + k \\pi, k \\in \\mathbb{Z}$", "$x = \\dfrac{\\pi}{4} + k 2\\pi, k \\in \\mathbb{Z}$", "$x = -\\dfrac{\\pi}{4} + k \\pi, k \\in \\mathbb{Z}$", "$x = \\dfrac{\\pi}{2} + k \\pi, k \\in \\mathbb{Z}$"], "correct": [0]}, {"type": "tn", "number": 11, "stem": "Một bánh xe có $72$ răng. Số đo góc (theo radian) mà bánh xe quay được khi quay $10$ răng là", "solution": "Bánh xe quay 1 vòng (72 răng) tương ứng với góc $2\\pi$ radian.<br/><br/> Khi quay 10 răng, bánh xe quay được một góc là $(\\dfrac{10}{72}) \\cdot 2\\pi = \\dfrac{5\\pi}{18}$ radian.", "options": ["$\\dfrac{5\\pi}{18}$", "$\\dfrac{5\\pi}{36}$", "$50^\\circ$", "$10\\pi$"], "correct": [0]}, {"type": "tn", "number": 12, "stem": "Chiều cao $h(t)$ của một con lắc lò xo so với mặt đất tại thời điểm $t$ giây được cho bởi phương trình $h(t) = 15 \\sin(\\pi t) + 30 (\\text{cm})$. Chiều cao lớn nhất của con lắc so với mặt đất là", "solution": "Vì $-1 \\le \\sin(\\pi t) \\le 1$ nên $h(t) \\le 15 \\cdot 1 + 30 = 45$.<br/><br/> Chiều cao lớn nhất là $45 \\text{ cm}$, đạt được khi $\\sin(\\pi t) = 1$.", "options": ["$45 \\text{ cm}$", "$30 \\text{ cm}$", "$15 \\text{ cm}$", "$60 \\text{ cm}$"], "correct": [0]}, {"type": "ds", "number": 13, "stem": "Nhiệt độ trung bình $T$ (tính bằng $\\circ C$) của một thành phố trong năm được mô hình hóa bởi hàm số <br/>$ T(t) = 15 \\sin(\\dfrac{\\pi}{6} (t - 3)) + 20 $<br/>trong đó $t$ là tháng trong năm ($1 \\le t \\le 12$, $t \\in \\mathbb{N}$). Biểu đồ mô phỏng nhiệt độ như hình vẽ dưới đây.<br/><br/>  <div style=\"text-align:center; margin: 10px 0;\"><svg class=\"typst-doc\" viewBox=\"0 0 389.60987339086614 134.28276315464566\" width=\"389.60987339086614pt\" height=\"134.28276315464566pt\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns:h5=\"http://www.w3.org/1999/xhtml\">\n    <g>\n        <g class=\"typst-group\" transform=\"matrix(1 0 0 1 5 5)\">\n            <g>\n                <path class=\"typst-shape\" fill=\"none\" stroke=\"#000000\" stroke-width=\"1\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\" stroke-miterlimit=\"4\" transform=\"matrix(1 0 0 1 12.529937007874015 111.96182614677164)\" d=\"M 0 0m 0 -0.0000000000000125883555 h 361.41064 \"/>\n                <path class=\"typst-shape\" fill=\"none\" stroke=\"#000000\" stroke-width=\"1\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\" stroke-miterlimit=\"4\" stroke-dashoffset=\"0\" stroke-dasharray=\"\" transform=\"matrix(1 0 0 1 373.94058205228345 109.83584189480314)\" d=\"M 0 0m 5.6692915 2.1259842 l -5.6692915 2.1259842 v -4.2519684 l 5.6692915 2.1259842 Z \"/>\n                <path class=\"typst-shape\" fill=\"none\" stroke=\"#000000\" stroke-width=\"1\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\" stroke-miterlimit=\"4\" transform=\"matrix(1 0 0 1 12.52993700 5(-1) + 20 = 5^\\circ C$.", "options": ["Nhiệt độ trung bình lớn nhất trong năm là $20^\\circ C$.", "Nhiệt độ trung bình thấp nhất trong năm là $5^\\circ C$.", "Tháng nóng nhất trong năm là tháng 5.", "Vào tháng 12, nhiệt độ trung bình của thành phố là $5^\\circ C$."], "correct": [1, 3]}, {"type": "ds", "number": 14, "stem": "Cho phương trình lượng giác $\\sin(2 x) = \\dfrac{1}{2}$. Xét tính đúng sai của các mệnh đề sau:", "solution": "a) đúng. <br/> $\n \\sin(2 x) = \\dfrac{1}{2} \\Leftrightarrow 2x = \\dfrac{\\pi}{6} + k 2\\pi\n $<br/> hoặc <br/> $\n 2x = \\dfrac{5\\pi}{6} + k 2\\pi \\Leftrightarrow x = \\dfrac{\\pi}{12} + k \\pi\n $<br/> hoặc $x = \\dfrac{5\\pi}{12} + k \\pi (k \\in \\mathbb{Z})$.<br/><br/> b) đúng. <br/> Với họ $x = \\dfrac{\\pi}{12} + k \\pi$, nghiệm âm lớn nhất khi $k = -1$ là $x = -\\dfrac{11\\pi}{12}$.<br/> Với họ $x = \\dfrac{5\\pi}{12} + k \\pi$, nghiệm âm lớn nhất khi $k = -1$ là $x = -\\dfrac{7\\pi}{12}$.<br/> So sánh hai nghiệm, ta thấy $-\\dfrac{7\\pi}{12} > -\\dfrac{11\\pi}{12}$.<br/><br/> c) đúng.<br/> Trên khoảng $(0; \\pi)$, họ $x = \\dfrac{\\pi}{12} + k \\pi$ có nghiệm $x = \\dfrac{\\pi}{12}$ ($k=0$).<br/> Họ $x = \\dfrac{5\\pi}{12} + k \\pi$ có nghiệm $x = \\dfrac{5\\pi}{12}$ ($k=0$).<br/> Vậy phương trình có 2 nghiệm.<br/><br/> d) sai.<br/> Trên đoạn $[0; 2\\pi]$, các nghiệm là $\\dfrac{\\pi}{12}$, $\\dfrac{5\\pi}{12}$, $\\dfrac{13\\pi}{12}$, $\\dfrac{17\\pi}{12}$.<br/> Tổng các nghiệm bằng $\\dfrac{36\\pi}{12} = 3\\pi$.", "options": ["Phương trình có nghiệm là $x = \\dfrac{\\pi}{12} + k \\pi$ và $x = \\dfrac{5\\pi}{12} + k \\pi (k \\in \\mathbb{Z})$.", "Nghiệm âm lớn nhất của phương trình là $x = -\\dfrac{7\\pi}{12}$.", "Phương trình có $2$ nghiệm thuộc khoảng $(0; \\pi)$.", "Tổng các nghiệm của phương trình trên đoạn $[0; 2\\pi]$ bằng $2\\pi$."], "correct": [1, 2]}, {"type": "ds", "number": 15, "stem": "Cho hàm số $y = \\cos^2 x - 2 \\cos x + 3$. Xét tính đúng sai của các mệnh đề sau:", "solution": "a) đúng. Do $-1 \\le \\cos x \\le 1$ với mọi $x$.<br/><br/> b) đúng.<br/> Xét hàm $f(t) = t^2 - 2t + 3$ trên $[-1; 1]$.<br/> Bảng biến thiên của $f(t)$ cho thấy hàm nghịch biến trên $[-1; 1]$, đạt giá trị nhỏ nhất tại $t = 1$ với $f(1) = 2$.<br/> Suy ra $\\min y = 2$ khi $\\cos x = 1$.<br/><br/> c) sai. Đạt giá trị lớn nhất tại $t = -1$ với $f(-1) = 6$. Vậy $\\max y = 6$.<br/><br/> d) đúng. Do $y(-x) = \\cos^2(-x) - 2 \\cos(-x) + 3 = \\cos^2 x - 2 \\cos x + 3 = y(x)$ nên hàm số là hàm số chẵn, đồ thị nhận trục tung làm trục đối xứng.", "options": ["Đặt $t = \\cos x$, điều kiện của $t$ là $t \\in [-1; 1]$.", "Hàm số đạt giá trị nhỏ nhất bằng $2$.", "Hàm số đạt giá trị lớn nhất bằng $5$.", "Đồ thị hàm số nhận trục tung làm trục đối xứng."], "correct": [0, 1, 3]}, {"type": "ds", "number": 16, "stem": "Mực nước cao nhất tại một cảng biển là $16 \\text{ m}$ và thấp nhất là $10 \\text{ m}$. Một hàm số lượng giác dạng $h(t) = A \\cos(\\omega t) + B$ được dùng để mô hình hoá chiều cao mực nước (tính bằng mét) theo thời gian $t$ (tính bằng giờ, $0 \\le t \\le 24$). Biết rằng lúc $t=0$ mực nước đạt cao nhất và chu kì của thuỷ triều là $12$ giờ. Hình vẽ dưới đây mô phỏng sự lên xuống của mực nước.<br/><br/>  <div style=\"text-align:center; margin: 10px 0;\"><svg class=\"typst-doc\" viewBox=\"0 0 218.67313323338584 148.45599150110237\" width=\"218.67313323338584pt\" height=\"148.45599150110237pt\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns:h5=\"http://www.w3.org/1999/xhtml\">\n    <g>\n        <g class=\"typst-group\" transform=\"matrix(1 0 0 1 5 5)\">\n            <g>\n                <path class=\"typst-shape\" fill=\"none\" stroke=\"#000000\" stroke-width=\"1\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\" stroke-miterlimit=\"4\" transform=\"matrix(1 0 0 1 11.671937007874014 126.13505449322835)\" d=\"M 0 0h 191.33191 \"/>\n                <path class=\"typst-shape\" fill=\"none\" stroke=\"#000000\" stroke-width=\"1\" stroke-linecap=\"butt\" stroke-linej ình mực nước là $h(t) = 3 \\cos(\\dfrac{\\pi}{6} t) + 13$. Tại $t = 2$, mực nước là $h(2) = 3 \\cos(\\dfrac{\\pi}{3}) + 13 = 3 (\\dfrac{1}{2}) + 13 = 14,5 \\text{ m}$.", "options": ["Giá trị của $A$ bằng $3$.", "Giá trị của $B$ bằng $13$.", "Tần số góc $\\omega = \\dfrac{\\pi}{12}$.", "Mực nước tại thời điểm $t = 2$ giờ là $11,5 \\text{ m}$."], "correct": [0, 1]}, {"type": "tln", "number": 17, "stem": "Một chiếc quạt giấy có bán kính $25 \\text{ cm}$. Khi mở rộng tối đa, góc ở tâm của vành quạt là $140^\\circ$. Tính chiều dài vành quạt (làm tròn đến hàng phần mười của cm).", "solution": "Đổi $140^\\circ = 140 \\cdot \\dfrac{\\pi}{180} = \\dfrac{7\\pi}{9}$ (rad).<br/> Độ dài vành quạt là $l = R \\alpha = 25 \\cdot \\dfrac{7\\pi}{9} = \\dfrac{175\\pi}{9} \\approx 61,1 \\text{ cm}$.", "answer": "61,1"}, {"type": "tln", "number": 18, "stem": "Có bao nhiêu giá trị nguyên của tham số $m$ để phương trình $3 \\sin x - m + 2 = 0$ có nghiệm?", "solution": "Ta có $\\sin x = \\dfrac{m - 2}{3}$.<br/><br/> Phương trình có nghiệm khi và chỉ khi <br/> $\n -1 \\le \\dfrac{m - 2}{3} \\le 1 \\Leftrightarrow -3 \\le m - 2 \\le 3 \\Leftrightarrow -1 \\le m \\le 5\n $<br/>.<br/><br/> Vì $m \\in \\mathbb{Z}$ nên $m \\in \\{-1; 0; 1; 2; 3; 4; 5\\}$.<br/><br/> Vậy có $7$ giá trị nguyên của $m$.", "answer": "7"}, {"type": "tln", "number": 19, "stem": "Tìm số nghiệm của phương trình $\\cos(2 x) - \\sin x = 0$ trên khoảng $(0; 3\\pi)$.", "solution": "Phương trình tương đương với <br/> $\n 1 - 2 \\sin^2 x - \\sin x = 0 \\Leftrightarrow 2 \\sin^2 x + \\sin x - 1 = 0\n $<br/>. Giải ra ta được $\\sin x = \\dfrac{1}{2}$ hoặc $\\sin x = -1$.<br/>Trường hợp 1: <br/> $\n \\sin x = \\dfrac{1}{2} \\Leftrightarrow x = \\dfrac{\\pi}{6} + k 2\\pi\n $<br/> hoặc $x = \\dfrac{5\\pi}{6} + k 2\\pi (k \\in \\mathbb{Z})$. Trên khoảng $(0; 3\\pi)$, ta được các nghiệm $\\dfrac{\\pi}{6}, \\dfrac{13\\pi}{6}$ và $\\dfrac{5\\pi}{6}, \\dfrac{17\\pi}{6}$.<br/>Trường hợp 2: <br/> $\n \\sin x = -1 \\Leftrightarrow x = -\\dfrac{\\pi}{2} + k 2\\pi (k \\in \\mathbb{Z})\n $<br/>. Trên khoảng $(0; 3\\pi)$, ta được nghiệm $x = \\dfrac{3\\pi}{2}$.<br/> Vậy phương trình có tất cả $5$ nghiệm trên khoảng đã cho.", "answer": "5"}, {"type": "tln", "number": 20, "stem": "Cho hàm số $y = 2 \\sin^2 x - 4 \\sin x + m$. Tìm $m$ để giá trị nhỏ nhất của hàm số bằng $3$.", "solution": "Đặt $t = \\sin x$, với $t \\in [-1; 1]$.<br/><br/> Hàm số trở thành $f(t) = 2t^2 - 4t + m$ trên đoạn $[-1; 1]$.<br/><br/> Bảng biến thiên của $f(t)$ trên $[-1; 1]$ cho thấy hàm số nghịch biến trên $[-1; 1]$, vì đỉnh của parabol là $t_0 = -\\dfrac{-4}{4} = 1 \\in [-1; 1]$.<br/><br/> Vậy giá trị nhỏ nhất đạt được tại $t = 1$, tức là $f(1) = 2(1)^2 - 4(1) + m = m - 2$.<br/><br/> Theo bài ra, <br/> $\n \\min y = 3 \\Leftrightarrow m - 2 = 3 \\Leftrightarrow m = 5\n $<br/>.", "answer": "5"}, {"type": "tln", "number": 21, "stem": "Huyết áp của một người được đo đạc và có thể mô hình hoá bởi hàm số $p(t) = 115 + 25 \\sin(160\\pi t)$, trong đó $p(t)$ là huyết áp tính bằng mmHg và $t$ là thời gian tính bằng phút. Biết nhịp tim của người này được tính là số chu kì của hàm số trong một phút. Tính nhịp tim của người đó (nhịp/phút).", "solution": "Chu kì của hàm số $p(t)$ là $T = \\dfrac{2\\pi}{160\\pi} = \\dfrac{1}{80}$ (phút).<br/><br/> Số chu kì trong một phút, tức là nhịp tim, là $\\dfrac{1}{T} = 80$ (nhịp/phút).", "answer": "80"}, {"type": "tln", "number": 22, "stem": "Một vòng quay Mặt Trời có bán kính $20 \\text{ m}$ và quay với tốc độ $2$ vòng mỗi giờ. Điểm thấp nhất của cabin cách mặt đất $5 \\text{ m}$. Cabin bắt đầu từ vị trí thấp nhất. Khoảng thời gian ngắn nhất (tính bằng phút) để cabin đạt độ cao $15 \\text{ m}$ là bao nhiêu?<br/><br/>  <div style=\"text-align:center; margin: 10px 0;\"><svg class=\"typst-doc\" viewBox=\"0 0 178.85278346456695 154.70349212598424\" width=\"178.85278346456695pt\" height=\"154.70349212598424pt\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns:h5=\"http // ─── Trạng thái ──────────────────────────────────────────────────────────────
const state = {
  tn:  {},   // câu_idx → selected option index
  ds:  {},   // câu_idx → Set of selected indices
  tln: {},   // câu_idx → string input
  checked: {}, // câu_idx → boolean
  points: {},  // câu_idx → 0/0.25/0.5/0.75/1
};

let submitted = false;
let scormAPI = null;

// ─── SCORM 1.2 ───────────────────────────────────────────────────────────────
function findAPI(w) {
  let n = 0;
  while (!w.API && w.parent && w.parent !== w) {
    if (++n > 7) break;
    w = w.parent;
  }
  return w.API;
}
function getAPI() {
  if (!scormAPI) scormAPI = findAPI(window) || (window.opener && findAPI(window.opener));
  return scormAPI;
}
function lmsInit() {
  const api = getAPI();
  if (api) { api.LMSInitialize(""); api.LMSSetValue("cmi.core.lesson_status","incomplete"); api.LMSCommit(""); }
}
function lmsFinish(score) {
  const api = getAPI();
  if (!api) return;
  api.LMSSetValue("cmi.core.score.raw", String(Math.round(score)));
  api.LMSSetValue("cmi.core.score.min", "0");
  api.LMSSetValue("cmi.core.score.max", "10");
  api.LMSSetValue("cmi.core.lesson_status", score >= 5 ? "passed" : "failed");
  api.LMSCommit("");
  api.LMSFinish("");
}

// ─── Render câu hỏi ──────────────────────────────────────────────────────────
function renderAll() {
  const container = document.getElementById('quiz-container');
  let html = '';
  let curSection = '';

  QUESTIONS.forEach((q, i) => {
    // Section header
    const sectionMap = { tn: 'PHẦN I — Trắc Nghiệm (ABCD)', ds: 'PHẦN II — Đúng / Sai', tln: 'PHẦN III — Trả Lời Ngắn' };
    const sec = sectionMap[q.type];
    if (sec !== curSection) {
      html += `<div class="section-header">${sec}</div>`;
      curSection = sec;
    }

    html += `<div class="card" id="card-${i}">`;
    html += `<div class="q-header">`;
    html += `<span class="q-num ${q.type}-type">Câu ${q.number}</span>`;
    html += `<div class="q-stem">${q.stem}</div>`;
    html += `</div>`;

    if (q.type === 'tn') {
      html += renderTN(q, i);
    } else if (q.type === 'ds') {
      html += renderDS(q, i);
    } else {
      html += renderTLN(q, i);
    }

    // Solution
    html += `<div class="solution" id="sol-${i}">`;
    html += `<div class="solution-label">📝 Lời giải</div>`;
    const solText = q.solution ? q.solution.replace(/\n/g, '<br/>') : '(Xem trong tài liệu)';
    html += `<div style="line-height: 1.6;">${solText}</div>`;
    html += `</div>`;

    html += `</div>`;
  });

  container.innerHTML = html;
  // Init DS state
  QUESTIONS.forEach((q, i) => {
    if (q.type === 'ds') state.ds[i] = new Set();
  });
};

function renderTN(q, i) {
  const labels = ['A','B','C','D'];
  let html = '<div class="options">';
  q.options.forEach((opt, j) => {
    html += `<div class="opt" id="opt-${i}-${j}" onclick="selectTN(${i},${j})">
      <div class="label">${labels[j]}</div>
      <div>${opt}</div>
    </div>`;
  });
  html += '</div>';
  html += `<div style="text-align:right;margin-top:10px">
    <button class="btn-check" id="btn-${i}" onclick="checkTN(${i})">Kiểm tra</button>
  </div>`;
  html += `<div class="feedback" id="fb-${i}" style="display:none"></div>`;
  return html;
};

function renderDS(q, i) {
  const labels = ['a','b','c','d'];
  let html = '<div style="margin-top:8px">';
  q.options.forEach((opt, j) => {
    html += `<div class="ds-opt" id="dsopt-${i}-${j}" onclick="toggleDS(${i},${j})">
      <div class="ds-check" id="dschk-${i}-${j}"></div>
      <div><strong>${labels[j]}</strong>) ${opt}</div>
    </div>`;
  });
  html += '</div>';
  html += `<div style="text-align:right;margin-top:10px">
    <button class="btn-check ds-btn" id="btn-${i}" onclick="checkDS(${i})">Kiểm tra</button>
  </div>`;
  html += `<div class="feedback" id="fb-${i}" style="display:none"></div>`;
  return html;
};

function renderTLN(q, i) {
  return `<div class="tln-row">
    <input class="tln-input" id="tln-${i}" placeholder="Nhập đáp án..." oninput="state.tln[${i}]=this.value"/>
    <button class="btn-check tln-btn" id="btn-${i}" onclick="checkTLN(${i})">Kiểm tra</button>
  </div>
  <div class="feedback" id="fb-${i}" style="display:none"></div>`;
};

// ─── Interaction ────────────────────────────────────────────────────────────────────────────
function selectTN(qi, oi) {
  if (state.checked[qi] || submitted) return;
  const prev = state.tn[qi];
  if (prev !== undefined) document.getElementById(`opt-${qi}-${prev}`).classList.remove('selected');
  state.tn[qi] = oi;
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
};

function toggleDS(qi, oi) {
  if (state.checked[qi] || submitted) return;
  const s = state.ds[qi];
  const el = document.getElementById(`dsopt-${qi}-${oi}`);
  const chk = document.getElementById(`dschk-${qi}-${oi}`);
  if (s.has(oi)) { s.delete(oi); el.classList.remove('selected'); chk.textContent = ''; }
  else           { s.add(oi);    el.classList.add('selected');    chk.textContent = '✓'; }
};

function checkTN(qi) {
  if (state.checked[qi] || submitted) return;
  const q = QUESTIONS[qi];
  const sel = state.tn[qi];
  if (sel === undefined) { alert('Bạn chưa chọn đáp án!'); return; }
  state.checked[qi] = true;

  const isCorrect = q.correct.includes(sel);
  state.points[qi] = isCorrect ? 1 : 0;

  q.options.forEach((_, j) => {
    const el = document.getElementById(`opt-${qi}-${j}`);
    el.classList.add('disabled');
    if (q.correct.includes(j)) el.classList.add('show-correct');
    else if (j === sel && !isCorrect) el.classList.add('show-wrong');
  });

  const fb = document.getElementById(`fb-${qi}`);
  fb.style.display = 'flex';
  fb.className = `feedback ${isCorrect ? 'ok' : 'err'}`;
  fb.innerHTML = isCorrect ? '✅ Chính xác!' : `❌ Sai. Đáp án đúng: ${['A','B','C','D'][q.correct[0]]}`;

  document.getElementById(`sol-${qi}`).classList.add('show');
  document.getElementById(`btn-${qi}`).disabled = true;
  document.getElementById(`card-${qi}`).classList.add(isCorrect ? 'correct' : 'wrong');
  document.getElementById(`card-${qi}`).classList.add('answered');
  setTimeout(() => { fb.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 100);
  updateProgress();
};


function checkDS(qi) {
  if (state.checked[qi] || submitted) return;
  const q = QUESTIONS[qi];
  const sel = state.ds[qi];
  if (sel.size === 0) { alert('Bạn chưa chọn mệnh đề nào!'); return; }
  state.checked[qi] = true;

  const correctSet = new Set(q.correct);
  let correct_cnt = 0;
  q.options.forEach((_, j) => {
    const el = document.getElementById(`dsopt-${qi}-${j}`);
    const chk = document.getElementById(`dschk-${qi}-${j}`);
    el.classList.add('disabled');
    const userSel = sel.has(j);
    const isCor = correctSet.has(j);
    if (isCor && userSel) { el.classList.add('show-correct'); correct_cnt++; }
    else if (isCor && !userSel) { el.classList.add('show-correct'); chk.textContent = '✓'; }
    else if (!isCor && userSel) { el.classList.add('show-wrong'); }
  });

  const total = q.correct.length;
  const pts = correct_cnt === total && sel.size === total ? 1
            : correct_cnt >= Math.ceil(total*0.75) ? 0.75
            : correct_cnt >= Math.ceil(total*0.5) ? 0.5
            : correct_cnt >= 1 ? 0.25 : 0;
  state.points[qi] = pts;

  const fb = document.getElementById(`fb-${qi}`);
  fb.style.display = 'flex';
  fb.className = `feedback ${pts === 1 ? 'ok' : pts >= 0.5 ? 'partial' : 'err'}`;
  fb.innerHTML = pts === 1 ? `✅ Hoàn toàn đúng! (${correct_cnt}/${total})` : `⚠️ Đúng ${correct_cnt}/${total} mệnh đề`;

  document.getElementById(`sol-${qi}`).classList.add('show');
  document.getElementById(`btn-${qi}`).disabled = true;
  document.getElementById(`card-${qi}`).classList.add(pts === 1 ? 'correct' : pts > 0 ? 'answered' : 'wrong');
  updateProgress();
};

function checkTLN(qi) {
  if (state.checked[qi] || submitted) return;
  const q = QUESTIONS[qi];
  const inp = document.getElementById(`tln-${qi}`);
  const userVal = (state.tln[qi] || inp.value).trim();
  if (!userVal) { alert('Bạn chưa nhập đáp án!'); return; }
  state.checked[qi] = true;

  // So sánh thông minh hơn: normalize unicode, số học, phân số
  function normalizeTLN(s) {
    return s
      .replace(/\$/g, '')           // loại bỏ $
      .replace(/−/g, '-')       // unicode minus − → -
      .replace(/·/g, '.')       // · → .
      .replace(/,/g, '.')            // dấu phẩy (số thập phân Việt) → .
      .replace(/\s+/g, '')          // bỏ whitespace
      .toLowerCase();
  }
  function tryNumeric(s) {
    // Cố gắng đọc dưới dạng số thập phân
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  function tryFraction(s) {
    // Hỗ trợ dạng a/b → số
    const m = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
    if (m) return parseFloat(m[1]) / parseFloat(m[2]);
    return null;
  }

  const normExpected = normalizeTLN(q.answer);
  const normActual   = normalizeTLN(userVal);

  let isCorrect = (normActual === normExpected);
  if (!isCorrect) {
    // So sánh số học với sai số nhỏ (1e-9)
    const numE = tryFraction(normExpected) ?? tryNumeric(normExpected);
    const numA = tryFraction(normActual)   ?? tryNumeric(normActual);
    if (numE !== null && numA !== null) {
      isCorrect = Math.abs(numE - numA) < 1e-9;
    }
  }
  state.points[qi] = isCorrect ? 1 : 0;

  inp.classList.add(isCorrect ? 'correct-input' : 'wrong-input');
  inp.classList.add('disabled');
  inp.readOnly = true;

  const fb = document.getElementById(`fb-${qi}`);
  fb.style.display = 'flex';
  fb.className = `feedback ${isCorrect ? 'ok' : 'err'}`;
  if (isCorrect) {
    fb.innerHTML = '✅ Đúng rồi!';
  } else {
    fb.innerHTML = `❌ Chưa đúng. Đáp án: <span id="tln-ans-${qi}">${q.answer}</span>`;
    // Re-render KaTeX cho đáp án
    try {
      const ansEl = document.getElementById(`tln-ans-${qi}`);
      if (ansEl && window.renderMathInElement) renderMathInElement(ansEl);
    } catch(e) {}
  }

  document.getElementById(`sol-${qi}`).classList.add('show');
  document.getElementById(`btn-${qi}`).disabled = true;
  document.getElementById(`card-${qi}`).classList.add(isCorrect ? 'correct' : 'wrong');
  document.getElementById(`card-${qi}`).classList.add('answered');
  // Auto-scroll đến feedback
  setTimeout(() => { fb.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 100);
  updateProgress();
};


// ─── Progress ─────────────────────────────────────────────────────────────────
function updateProgress() {
  const total = QUESTIONS.length;
  const done = Object.keys(state.checked).length;
  const pts = Object.values(state.points).reduce((a,b) => a+b, 0);
  const score10 = total > 0 ? (pts / total * 10).toFixed(1) : 0;

  document.getElementById('score-badge').textContent = `${score10} / 10`;
  document.getElementById('done-lbl').textContent = `${done}/${total} câu`;
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-ring').style.background =
    `conic-gradient(var(--blue) ${pct}%, #1e2030 ${pct}%)`;
};

// ─── Submit ───────────────────────────────────────────────────────────────────
function submitAll() {
  submitted = true;
  document.getElementById('btn-submit').disabled = true;

  // Tự động kiểm tra các câu chưa làm
  QUESTIONS.forEach((q, i) => {
    if (!state.checked[i]) {
      state.points[i] = 0;
      state.checked[i] = true;
    }
  });
  updateProgress();

  const total = QUESTIONS.length;
  const pts = Object.values(state.points).reduce((a,b)=>a+b,0);
  const score10 = total > 0 ? pts / total * 10 : 0;
  const pct = Math.round(score10*10);

  const banner = document.getElementById('result-banner');
  banner.classList.add('show');
  const sc = document.getElementById('result-score');
  sc.textContent = score10.toFixed(1) + ' / 10';
  sc.className = `result-score ${score10 >= 8 ? 'high' : score10 >= 5 ? 'mid' : 'low'}`;
  document.getElementById('result-msg').textContent =
    score10 >= 9 ? '🏆 Xuất sắc! Bạn nắm rất vững kiến thức.' :
    score10 >= 7 ? '🎉 Tốt! Cần ôn thêm vài điểm nhỏ.' :
    score10 >= 5 ? '📚 Cần ôn tập thêm một số phần.' :
    '💪 Hãy xem lại lời giải và ôn tập kỹ hơn.';

  banner.scrollIntoView({behavior:'smooth'});
  lmsFinish(score10);
};

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  lmsInit();
  renderAll();
  updateProgress();
  // Re-render math after dynamic content
  if (window.renderMathInElement) {
    setTimeout(() => renderMathInElement(document.body, {
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError: false
    }), 200);
  }
});
</script>
